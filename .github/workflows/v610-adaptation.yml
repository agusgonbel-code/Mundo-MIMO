name: Mundo Mimo V610 Adaptation QA
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
concurrency:
  group: mundo-mimo-v610-${{ github.ref }}
  cancel-in-progress: true
jobs:
  adaptation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-v610-http.log 2>&1 &
      - name: Certify adaptive engine is driven by real gameplay
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/adaptation-v610.spec.js --config=qa/playwright.config.js --project=webkit --reporter=line
