name: Mundo Mimo V370 Diagnostic
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'qa/runtime-v370.spec.js'
      - '.github/workflows/v370-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v370:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-http.log 2>&1 &
      - name: Run V370 regression gate
        id: test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set +e
          npx playwright test qa/runtime-v370.spec.js --config=qa/playwright.config.js --reporter=line > /tmp/v370.log 2>&1
          code=$?
          set -e
          cat /tmp/v370.log
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v370-diagnostic
          path: /tmp/v370.log
          retention-days: 7
      - name: Enforce V370 gate
        if: always()
        run: test "${{ steps.test.outputs.code }}" = "0"
