name: Mundo Mimo V660 Functional Differentiation QA

on:
  pull_request:
  workflow_dispatch:

jobs:
  functional-differentiation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start app
        run: python3 -m http.server 4173 >/tmp/mimo-http.log 2>&1 &
      - name: Run V660 functional differentiation QA
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/functional-differentiation-v660.spec.js --config=qa/playwright.config.js --reporter=line
