name: Mundo Mimo V580 Child Privacy QA
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mundo-mimo-v580-privacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local app
        run: python3 -m http.server 4173 >/tmp/mimo-privacy-http.log 2>&1 &
      - name: Run child privacy regressions
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/privacy-v580.spec.js --config=qa/playwright.config.js --reporter=line
      - name: Assert privacy guard is offline core
        run: |
          grep -q "./v2/core/privacy-v580.js" sw.js
          grep -q "./core/privacy-v580.js" v2/app-v200.html
          grep -q "<key>NSPrivacyTracking</key>" PrivacyInfo.xcprivacy
          grep -A1 "<key>NSPrivacyTracking</key>" PrivacyInfo.xcprivacy | grep -q "<false/>"