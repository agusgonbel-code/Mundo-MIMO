name: Mundo Mimo Launch QA
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mundo-mimo-launch-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[skip qa]') && !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit for iPhone emulation
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Bundle licensed audio locally for QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          curl -fL --retry 3 -o assets/audio/dog.ogg 'https://upload.wikimedia.org/wikipedia/commons/4/4c/George_vuf_1996.ogg'
          curl -fL --retry 3 -o assets/audio/cat.ogg 'https://upload.wikimedia.org/wikipedia/commons/6/62/Meow.ogg'
          curl -fL --retry 3 -o assets/audio/cow.ogg 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Single_Cow_Moo.ogg'
          curl -fL --retry 3 -o assets/audio/frog.oga 'https://upload.wikimedia.org/wikipedia/commons/9/9f/Single_Frog_Croak.oga'
          curl -fL --retry 3 -o assets/audio/voice-perro.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-perro.wav'
          curl -fL --retry 3 -o assets/audio/voice-vamos.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Knites-%C2%A1Vamos!.wav'
          curl -fL --retry 3 -o assets/audio/voice-uno.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Akrit0mythos-uno.wav'
          curl -fL --retry 3 -o assets/audio/voice-dos.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-dos.wav'
          curl -fL --retry 3 -o assets/audio/voice-tres.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Rachlel-tres.wav'
          curl -fL --retry 3 -o assets/audio/voice-estrella.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-estrella.wav'
          curl -fL --retry 3 -o assets/audio/voice-pez.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-pez.wav'
          curl -fL --retry 3 -o assets/audio/voice-pequeno.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-peque%C3%B1o.wav'
          curl -fL --retry 3 -o assets/audio/voice-triste.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Knites-triste.wav'
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-http.log 2>&1 &
      - name: Run product, curriculum, V2 architecture/runtime, mechanics, accessibility, privacy, performance, worlds, parent-zone, recovery, rotation/state and user-behavior gates
        id: test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        shell: bash
        run: |
          set +e
          npx playwright test qa/e2e.spec.js qa/premium-v71.spec.js qa/premium-offline-v72.spec.js qa/challenge-v100.spec.js qa/learning-model-v130.spec.js qa/platform-v200.spec.js qa/runtime-v200.spec.js qa/runtime-v210.spec.js qa/runtime-v220.spec.js qa/runtime-v230.spec.js qa/runtime-v240.spec.js qa/runtime-v250.spec.js qa/runtime-v260.spec.js qa/runtime-v270.spec.js qa/runtime-v280.spec.js qa/runtime-v290.spec.js qa/runtime-v300.spec.js qa/runtime-v310.spec.js qa/runtime-v320.spec.js qa/runtime-v330.spec.js qa/runtime-v340.spec.js qa/runtime-v350.spec.js qa/runtime-v360.spec.js qa/runtime-v370.spec.js qa/runtime-v380.spec.js qa/runtime-v390.spec.js qa/runtime-v400.spec.js qa/runtime-v410.spec.js qa/runtime-v420.spec.js qa/runtime-v430.spec.js qa/content-depth-v500.spec.js qa/worlds-v510.spec.js qa/parent-zone-v520.spec.js qa/recovery-v570.spec.js qa/privacy-v580.spec.js qa/performance-v590.spec.js qa/mechanics-v600.spec.js qa/visual-system-v110.spec.js qa/visual-coverage-v112.spec.js qa/accessibility-v113.spec.js qa/orientation-state.spec.js qa/user-100-sim.spec.js --config=qa/playwright.config.js --reporter=line > /tmp/mimo-qa.log 2>&1
          CODE=$?
          set -e
          mkdir -p qa
          {
            echo "MUNDO MIMO LAUNCH QA"
            echo "UTC: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "COMMIT: $GITHUB_SHA"
            if [ "$CODE" -eq 0 ]; then echo "RESULT: PASS"; else echo "RESULT: FAIL"; fi
            echo "EXIT_CODE: $CODE"
            echo "LEGACY PRODUCT: 24 guided activities x 3 selectable UI age groups x 6 rounds; 2400 challenge variants are reported as variants, not games."
            echo "CURRICULUM/V2: honest metrics gate + six developmental bands + V600 >=40 catalog-backed mechanics with physical WebKit representative launches + clone detection + 150 independently playable games + V500 depth target of 600 activities, 5400 levels and 27000 structurally validated challenges."
            echo "EXPERIENCE: V510 six native explorable worlds with progress unlocks + V520 adult-gated local-only parent dashboard with truthful progress summaries and family preferences."
            echo "RECOVERY V570: V2 active-game and age-context restoration after interruption/reload, voluntary-close semantics, corruption defense, persisted progress integrity and recovered-session iPhone/iPad rotation usability."
            echo "PRIVACY V580: local-only child runtime guard blocks third-party network/navigation/resources and is consistent with the iOS privacy manifest."
            echo "PERFORMANCE V590: explicit WebKit startup/resource budgets, offscreen card rendering containment, repeated age-switch churn without duplicate cards, and overflow-free 320px/iPad interaction."
            echo "OTHER COVERAGE: per-game visual/accessibility + persistence/offline + adaptive/audio/privacy + legacy orientation-state retention + 30 user-behavior scenarios."
            echo "--- TEST OUTPUT (tail) ---"
            tail -n 1500 /tmp/mimo-qa.log
          } > qa/latest-result.txt
          cat qa/latest-result.txt
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
      - name: Upload QA diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-mimo-launch-diagnostic
          path: qa/latest-result.txt
          retention-days: 7
      - name: Persist QA evidence
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          cp qa/latest-result.txt /tmp/mimo-latest-result.txt
          git config user.name 'Mundo Mimo QA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          CURRENT="$(git rev-parse origin/main)"
          if [ "$CURRENT" != "$GITHUB_SHA" ]; then
            MATERIAL_CHANGES="$(git diff --name-only "$GITHUB_SHA"..origin/main | grep -Ev '^qa/(latest-result|latest-user-sim)\.txt$' || true)"
            if [ -n "$MATERIAL_CHANGES" ]; then
              echo "Skipping stale QA evidence because newer product/workflow commits exist on main:"
              echo "$MATERIAL_CHANGES"
              exit 0
            fi
          fi
          git reset --hard origin/main
          cp /tmp/mimo-latest-result.txt qa/latest-result.txt
          git add qa/latest-result.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'QA result: automated launch matrix [skip ci]'
          git push origin HEAD:main
      - name: Enforce QA gate
        if: always()
        shell: bash
        run: test "${{ steps.test.outputs.code }}" = "0"