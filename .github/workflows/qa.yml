name: Mundo Mimo Launch QA

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate critical runtime syntax
        run: |
          node --check assets/challenge-engine-v100.js
          node --check assets/app-v70.js
      - name: Validate challenge library contract
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('assets/challenge-engine-v100.js','utf8');
          const store={};
          const sandbox={globalThis:{},localStorage:{getItem:k=>store[k]||null,setItem:(k,v)=>store[k]=v},document:{readyState:'loading',addEventListener(){},getElementById(){return null},querySelector(){return null}}};
          sandbox.globalThis=sandbox;
          vm.runInNewContext(code,sandbox);
          const api=sandbox.MundoMimoChallengesV100;
          if(!api||api.totalChallenges!==2400||api.gameIds.length!==24||api.variantsPerGame!==100) throw new Error('Contrato de 2400 retos incompleto');
          for(const game of api.gameIds){const ids=new Set();for(let i=0;i<100;i++){const c=api.challengeAt(game,i,3);if(!c||!c.id||!c.copy)throw new Error(`Reto inválido ${game}/${i}`);ids.add(c.id);}if(ids.size!==100)throw new Error(`Retos duplicados en ${game}`);}
          console.log('2400 retos verificados');
          NODE

  webkit-shards:
    needs: static-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit ffmpeg
      - name: Create deterministic local QA audio fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          python3 - <<'PY'
          import wave, math, struct
          path='/tmp/mimo-tone.wav'; rate=8000; duration=.18
          with wave.open(path,'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(rate)
              for i in range(int(rate*duration)):
                  v=int(9000*math.sin(2*math.pi*440*i/rate)); w.writeframes(struct.pack('<h',v))
          for name in ['voice-perro.wav','voice-vamos.wav','voice-uno.wav','voice-dos.wav','voice-tres.wav','voice-estrella.wav','voice-pez.wav','voice-pequeno.wav','voice-triste.wav']:
              open('assets/audio/'+name,'wb').write(open(path,'rb').read())
          PY
          FFMPEG="$(find "$HOME/.cache/ms-playwright" -type f -name ffmpeg -perm -111 | head -n 1)"
          test -n "$FFMPEG"
          "$FFMPEG" -loglevel error -y -i /tmp/mimo-tone.wav assets/audio/dog.ogg
          cp assets/audio/dog.ogg assets/audio/cat.ogg
          cp assets/audio/dog.ogg assets/audio/cow.ogg
          cp assets/audio/dog.ogg assets/audio/frog.oga
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-http.log 2>&1 &
      - name: Run sharded iPhone/WebKit matrix
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: |
          npx playwright test qa/e2e.spec.js qa/premium-v71.spec.js qa/premium-offline-v72.spec.js qa/challenge-v100.spec.js qa/challenge-runtime-v101.spec.js --config=qa/playwright.config.js --reporter=line --shard=${{ matrix.shard }}/3

  qa-gate:
    if: always()
    needs: [static-gates, webkit-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce complete QA matrix
        run: |
          test "${{ needs.static-gates.result }}" = "success"
          test "${{ needs.webkit-shards.result }}" = "success"
