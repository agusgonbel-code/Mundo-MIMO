name: Mundo Mimo V650 Device Orientation QA
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'qa/device-orientation-v650.spec.js'
      - 'qa/playwright.config.js'
      - '.github/workflows/v650-device-orientation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device-orientation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-v650-http.log 2>&1 &
      - name: Certify iPhone iPad orientation and persistence
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/device-orientation-v650.spec.js --config=qa/playwright.config.js --project=webkit --reporter=line
