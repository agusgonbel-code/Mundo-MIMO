name: Mundo Mimo V390 Diagnostic
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'qa/runtime-v390.spec.js'
      - '.github/workflows/v390-diagnostic.yml'
  workflow_dispatch:
jobs:
  v390:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-v390-http.log 2>&1 &
      - name: Run V390 regression gate
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/runtime-v390.spec.js --config=qa/playwright.config.js --reporter=line
