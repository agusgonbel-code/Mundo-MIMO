name: Mundo Mimo V520 Parent Zone QA
on:
  pull_request:
  workflow_dispatch:
jobs:
  v520:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start local server
        run: python3 -m http.server 4173 >/tmp/mimo-v520-http.log 2>&1 &
      - name: Run V520 parent-zone regression
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/parent-zone-v520.spec.js --config=qa/playwright.config.js --reporter=line
