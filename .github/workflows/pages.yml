name: Deploy Mundo Mimo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Bundle licensed audio locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/audio
          fetch(){ curl -fL --retry 5 --retry-all-errors --retry-delay 4 --max-time 120 -o "$1" "$2"; sleep 2; }
          fetch assets/audio/dog.ogg 'https://upload.wikimedia.org/wikipedia/commons/4/4c/George_vuf_1996.ogg'
          fetch assets/audio/cat.ogg 'https://upload.wikimedia.org/wikipedia/commons/6/62/Meow.ogg'
          fetch assets/audio/cow.ogg 'https://upload.wikimedia.org/wikipedia/commons/a/a5/Single_Cow_Moo.ogg'
          fetch assets/audio/frog.oga 'https://upload.wikimedia.org/wikipedia/commons/9/9f/Single_Frog_Croak.oga'
          fetch assets/audio/voice-perro.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-perro.wav'
          fetch assets/audio/voice-vamos.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Knites-%C2%A1Vamos!.wav'
          fetch assets/audio/voice-uno.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Akrit0mythos-uno.wav'
          fetch assets/audio/voice-dos.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-dos.wav'
          fetch assets/audio/voice-tres.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Rachlel-tres.wav'
          fetch assets/audio/voice-estrella.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-estrella.wav'
          fetch assets/audio/voice-pez.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-pez.wav'
          fetch assets/audio/voice-pequeno.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Guergana-peque%C3%B1o.wav'
          fetch assets/audio/voice-triste.wav 'https://commons.wikimedia.org/wiki/Special:Redirect/file/LL-Q1321_(spa)-Knites-triste.wav'
          test -s assets/audio/dog.ogg
          test -s assets/audio/voice-perro.wav
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
