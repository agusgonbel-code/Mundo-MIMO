name: Mundo Mimo V640 Accessibility QA

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: mundo-mimo-v640-accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright WebKit
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps webkit
      - name: Start Mundo Mimo V2
        run: python3 -m http.server 4173 >/tmp/mimo-v640-http.log 2>&1 &
      - name: Certify V2 accessibility on iPhone and iPad
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test qa/accessibility-v640.spec.js --config=qa/playwright.config.js --project=webkit --reporter=line
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mundo-mimo-v640-accessibility-diagnostics
          path: |
            test-results/
            /tmp/mimo-v640-http.log
          if-no-files-found: warn
          retention-days: 14
