<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#574de8"><link rel="manifest" href="./manifest.webmanifest"><title>Mundo Mimo v30</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#574de8}iframe{border:0;width:100%;height:100%;display:block}.voice{position:fixed;right:12px;bottom:12px;z-index:9;border:4px solid #fff;border-radius:18px;background:#ffe653;color:#44338e;padding:9px 12px;font:900 13px ui-rounded,-apple-system,sans-serif;box-shadow:0 5px #9c6b11}.celebrate{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}.star{position:absolute;bottom:18%;font-size:34px;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translateY(-220px) rotate(180deg) scale(.4);opacity:0}}</style></head><body><iframe id="app" src="./app-v29.html" title="Mundo Mimo"></iframe><button id="voice" class="voice">🔊 VOZ: SÍ</button><div id="fx" class="celebrate"></div><script>let voiceOn=true,last='',lastAt=0;const frame=document.getElementById('app'),voiceBtn=document.getElementById('voice');function bestVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/^es[-_]/i.test(v.lang)&&/premium|enhanced|mónica|paulina|jorge|marisol/i.test(v.name))||vs.find(v=>/^es[-_]/i.test(v.lang))||vs[0]}function speak(text){if(!voiceOn||!text||text.length<2)return;let clean=text.replace(/[✓⭐✨🎉👏🔊🧠🎵🔢🌈🔷📚😊🎨🧩🧺🏠🌳💦▶←]/g,' ').replace(/\s+/g,' ').trim();if(!clean||clean===last&&Date.now()-lastAt<1600)return;last=clean;lastAt=Date.now();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(clean);u.lang='es-ES';u.rate=.82;u.pitch=1.12;const v=bestVoice();if(v)u.voice=v;speechSynthesis.speak(u)}function applause(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),now=c.currentTime;for(let i=0;i<8;i++){const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=520+(i%4)*110;g.gain.setValueAtTime(.0001,now+i*.055);g.gain.exponentialRampToValueAtTime(.07,now+i*.055+.01);g.gain.exponentialRampToValueAtTime(.0001,now+i*.055+.12);o.connect(g).connect(c.destination);o.start(now+i*.055);o.stop(now+i*.055+.13)}setTimeout(()=>c.close(),900);for(let i=0;i<12;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','✨','💛'][i%3];s.style.left=(10+Math.random()*80)+'%';fx.appendChild(s);setTimeout(()=>s.remove(),950)}}function textOf(el){if(!el)return'';return (el.innerText||el.textContent||'').trim()}frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(!d)return;const watch=new MutationObserver(ms=>{for(const m of ms){const el=m.target.nodeType===3?m.target.parentElement:m.target;if(el&&el.closest&&el.closest('.feedback,.prompt,.story,#worldTitle,#worldDesc')){const t=textOf(el.closest('.feedback,.prompt,.story,#worldTitle,#worldDesc'));if(t)speak(t)}}});watch.observe(d.body,{subtree:true,childList:true,characterData:true});d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;setTimeout(()=>{const fb=d.querySelector('.feedback');const t=textOf(fb);if(/muy bien|genial|conseguiste|correct|bravo|perfect/i.test(t)){speak(t);applause()}else if(t)speak(t);else{const label=(b.getAttribute('aria-label')||textOf(b)).trim();if(label&&label.length<70)speak(label)}},80)},true);setTimeout(()=>{const h=d.querySelector('.hero h1');if(h)speak('Bienvenido a Mundo Mimo. Juega, aprende e imagina.')},500)});voiceBtn.onclick=()=>{voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();voiceBtn.textContent=voiceOn?'🔊 VOZ: SÍ':'🔇 VOZ: NO';if(voiceOn)speak('Voz activada')};if('speechSynthesis'in window)speechSynthesis.getVoices();</script></body></html>
