ttom:18%;font-size:34px;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translateY(-220px) rotate(180deg) scale(.4);opacity:0}}@media(max-width:650px){.hero{grid-template-columns:1fr}.hero h1{font-size:31px}.cast img{max-height:145px}.worlds{grid-template-columns:1fr}.world{grid-template-columns:1fr 110px;min-height:155px}.world img{height:110px}.intro{grid-template-columns:95px 1fr}.intro img{height:95px}.tabs{grid-template-columns:1fr}.characters{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.answers,.colorGrid,.shapeGrid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><section id="home" class="screen on"><header class="top"><div class="logo">Mundo <b>Mimo</b> ⭐</div><button id="voiceBtn" class="pill" onclick="toggleVoice()">🔊 VOZ SÍ</button></header><div class="hero"><div><span class="eyebrow">✨ AVENTURAS PARA 0–6 AÑOS</span><h1>Juega.<br>Aprende.<br>Imagina.</h1><p>Todo lo que aparece escrito se acompaña con voz y los logros se celebran.</p><button class="cta" onclick="openWorld('forest')">▶ ¡EMPEZAR!</button></div><div class="cast"><img src="./assets/pipa-elephant.svg"><img src="./assets/mimo-bear.svg"><img src="./assets/lio-lion.svg"></div></div><div class="worlds"><button class="world villa" onclick="openWorld('village')"><div><h3>🏠 Villa Mimo</h3><p>Cuentos, emociones y creatividad.</p></div><img src="./assets/mimo-bear.svg"></button><button class="world forest" onclick="openWorld('forest')"><div><h3>🌳 Bosque de Lío</h3><p>Animales, memoria y sonidos reales.</p></div><img src="./assets/lio-lion.svg"></button><button class="world lagoon" onclick="openWorld('lagoon')"><div><h3>💦 Laguna de Pipa</h3><p>Números, colores y formas.</p></div><img src="./assets/pipa-elephant.svg"></button><button class="world mount" onclick="openWorld('mount')"><div><h3>⭐ Monte Aventura</h3><p>Letras, patrones y clasificación.</p></div><img src="./assets/mimo-bear.svg"></button></div><div class="trust"><b>👨‍👩‍👧 Para jugar con tranquilidad</b><div class="trustRow"><span>✓ Sin anuncios</span><span>✓ Sin compras</span><span>✓ Sin cronómetros</span><span>✓ Sonidos reales</span><span>✓ Refuerzo positivo</span></div></div></section><section id="world" class="screen"><div class="bar"><button class="back" onclick="goHome()">← INICIO</button><div class="logo">Mundo <b>Mimo</b> ⭐</div></div><div class="panel"><div class="intro"><img id="worldHero"><div><h2 id="worldTitle"></h2><p id="worldDesc"></p></div></div><div id="tabs" class="tabs"></div><div id="games"></div></div></section></div><div id="fx" class="fx"></div><script src="./assets/audio-bank-v31.js"></script><script>let voiceOn=true,currentWorld='forest',currentGame='';const worlds={forest:{title:'Bosque de Lío',desc:'Animales, memoria y sonidos reales.',hero:'./assets/lio-lion.svg',tabs:[['safari','Safari'],['pairs','Parejas'],['sounds','¿Quién suena?']]},lagoon:{title:'Laguna de Pipa',desc:'Números, colores y formas.',hero:'./assets/pipa-elephant.svg',tabs:[['count','Contar'],['colors','Colores'],['shapes','Formas']]},village:{title:'Villa Mimo',desc:'Cuentos, emociones y creatividad.',hero:'./assets/mimo-bear.svg',tabs:[['stories','Cuentos'],['emotions','Emociones'],['draw','Dibujo']]},mount:{title:'Monte Aventura',desc:'Letras, patrones y clasificación.',hero:'./assets/mimo-bear.svg',tabs:[['letters','Letras'],['logic','Lógica'],['sort','Clasificar']]}};const chars=[['Perro','./assets/dog-mimo.svg','dog'],['Gato','./assets/cat-mimo.svg','cat'],['Vaca','./assets/cow-mimo.svg','cow'],['Rana','./assets/frog-mimo.svg','frog']];function bestVoice(){const vs=speechSynthesis.getVoices();return vs.find(v=>/^es[-_]/i.test(v.lang)&&/premium|enhanced|mónica|paulina|jorge/i.test(v.name))||vs.find(v=>/^es[-_]/i.test(v.lang))||vs[0]}function say(t){if(!voiceOn||!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.84;u.pitch=1.05;const v=bestVoice();if(v)u.voice=v;speechSynthesis.speak(u)}function toggleVoice(){voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();voiceBtn.textContent=voiceOn?'🔊 VOZ SÍ':'🔇 VOZ NO';if(voiceOn)say('Voz activada')}function chime(ok=true){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain(),n=c.currentTime;o.type='triangle';o.frequency.value=ok?720:260;g.gain.setValueAtTime(.08,n);g.gain.exponentialRampToValueAtTime(.001,n+.22);o.connect(g).connect(c.destination);o.start();o.stop(n+.23);setTimeout(()=>c.close(),350)}function celebrate(msg='¡Muy bien!'){say(msg);chime(true);for(let i=0;i<12;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','✨','👏','💛'][i%4];s.style.left=(10+Math.random()*80)+'%';fx.appendChild(s);setTimeout(()=>s.remove(),950)}}function gentle(msg='Prueba otra vez'){say(msg);chime(false)}function openWorld(k){currentWorld=k;home.classList.remove('on');world.classList.add('on');const w=worlds[k];worldHero.src=w.hero;worldTitle.textContent=w.title;worldDesc.textContent=w.desc;tabs.innerHTML=w.tabs.map((x,i)=>`<button class="tab ${i?'':'on'}" onclick="showGame('${x[0]}',this)">${x[1]}</button>`).join('');showGame(w.tabs[0][0],tabs.firstElementChild);say(w.title+'. '+w.desc)}function goHome(){world.classList.remove('on');home.classList.add('on');say('Inicio de Mundo Mimo')}function showGame(id,btn){currentGame=id;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');render(id)}function render(id){const g=games;if(id==='safari'){g.innerHTML=`<div class="game on"><div class="prompt">Toca un animal para conocerlo</div><div class="characters">${chars.map((c,i)=>`<button class="char" onclick="safari(${i})"><img src="${c[1]}"><b>${c[0]}</b></button>`).join('')}</div><div id="stage" class="bigStage" style="margin-top:12px"><img src="${chars[0][1]}"><div class="prompt">${chars[0][0]}</div><button class="listen" onclick="animalSound(0)">🔊 ESCUCHAR</button></div></div>`;say('Toca un animal para conocerlo');return}if(id==='pairs'){dealPairs();return}if(id==='sounds'){newSound();return}if(id==='count'){newCount();return}if(id==='colors'){newColor();return}if(id==='shapes'){newShape();return}if(id==='stories'){storyGame();return}if(id==='emotions'){newEmotion();return}if(id==='draw'){drawGame();return}if(id==='letters'){newLetter();return}if(id==='logic'){newLogic();return}if(id==='sort'){newSort();return}}function safari(i){stage.innerHTML=`<img src="${chars[i][1]}"><div class="prompt">${chars[i][0]}</div><button class="listen" onclick="animalSound(${i})">🔊 ESCUCHAR</button>`;say(chars[i][0])}async function animalSound(i){say(chars[i][0]);try{await MimoAudio.play(chars[i][2])}catch{gentle('No se pudo cargar el sonido ahora')}}let first=null,lock=false;function dealPairs(){const d=[0,0,1,1,2,2,3,3].sort(()=>Math.random()-.5);games.innerHTML=`<div class="game on"><div class="prompt">Encuentra dos personajes iguales</div><div class="cards">${d.map(x=>`<button class="card" data-i="${x}" onclick="flip(this)"><img src="${chars[x][1]}"></button>`).join('')}</div></div>`;say('Encuentra dos personajes iguales')}function flip(el){if(lock||el===first||el.classList.contains('done'))return;el.classList.add('open');if(!first){first=el;return}if(first.dataset.i===el.dataset.i){first.classList.add('done');el.classList.add('done');first=null;celebrate('¡Pareja encontrada!')}else{lock=true;const a=first;setTimeout(()=>{a.classList.remove('open');el.classList.remove('open');first=null;lock=false;gentle('Casi. Prueba otra vez')},550)}}let soundTarget=0;function newSound(){soundTarget=Math.floor(Math.random()*4);games.innerHTML=`<div class="game on"><div class="prompt">Escucha y toca el animal correcto</div><div class="characters">${chars.map((c,i)=>`<button class="char" onclick="pickSound(${i})"><img src="${c[1]}"><b>${c[0]}</b></button>`).join('')}</div><div style="text-align:center;margin-top:14px"><button class="listen" onclick="MimoAudio.play(chars[soundTarget][2])">🔊 ESCUCHAR PISTA</button></div></div>`;say('Escucha y toca el animal correcto');MimoAudio.play(chars[soundTarget][2]).catch(()=>{})}function pickSound(i){if(i===soundTarget){celebrate('¡Correcto! Es '+chars[i][0]);setTimeout(newSound,700)}else gentle('Escucha otra vez')}function newCount(){const n=1+Math.floor(Math.random()*6);const opts=[n,Math.max(1,n-1),Math.min(6,n+1)].filter((x,i,a)=>a.indexOf(x)===i).sort(()=>Math.random()-.5);games.innerHTML=`<div class="game on"><div class="prompt">¿Cuántos peces hay?</div><div class="countRow">${Array.from({length:n},(_,i)=>i%2?'🐠':'🐟').join('')}</div><div class="answers">${opts.map(x=>`<button class="ans" onclick="pickCount(${x},${n})">${x}</button>`).join('')}</div></div>`;say('¿Cuántos peces hay?')}function pickCount(x,n){x===n?(celebrate('¡Muy bien! Hay '+n+' peces'),setTimeout(newCount,700)):gentle('Cuenta otra vez')}const colors=[['Rojo','#ff5364'],['Azul','#379fea'],['Verde','#57cf69'],['Amarillo','#ffd84d'],['Rosa','#ff83ba'],['Morado','#8b6ee8']];let ct=0;function newColor(){ct=Math.floor(Math.random()*colors.length);games.innerHTML=`<div class="game on"><div class="prompt">Toca el color ${colors[ct][0]}</div><div class="colorGrid">${colors.map((c,i)=>`<button class="color" style="background:${c[1]}" onclick="pickColor(${i})" aria-label="${c[0]}"></button>`).join('')}</div></div>`;say('Toca el color '+colors[ct][0])}function pickColor(i){i===ct?(celebrate('¡Muy bien! '+colors[i][0]),setTimeout(newColor,700)):gentle('Busca otro color')}const shapes=[['●','círculo'],['■','cuadrado'],['▲','triángulo'],['♥','corazón'],['★','estrella'],['◆','rombo']];let sh=0;function newShape(){sh=Math.floor(Math.random()*shapes.length);games.innerHTML=`<div class="game on"><div class="prompt">Busca el ${shapes[sh][1]}</div><div class="shapeGrid">${shapes.map((s,i)=>`<button class="shape" onclick="pickShape(${i})">${s[0]}</button>`).join('')}</div></div>`;say('Busca el '+shapes[sh][1])}function pickShape(i){i===sh?(celebrate('¡Lo encontraste!'),setTimeout(newShape,700)):gentle('Mira otra vez')}const stories=[['🐻⭐🌳','Mimo encontró una estrella junto al bosque.'],['🐻🦁🤝','Lío llegó para ayudar a Mimo.'],['🐘💧🌱','Pipa trajo agua y cuidaron juntos una planta.'],['🌳⭐🌙','Al llegar la noche, la estrella volvió al cielo.']];let si=0;function storyGame(){games.innerHTML=`<div class="game on"><div class="story"><div id="sv" class="storyVisual"></div><p id="st"></p><button class="listen" onclick="nextStory()">SIGUIENTE ▶</button></div></div>`;renderStory()}function renderStory(){sv.textContent=stories[si][0];st.textContent=stories[si][1];say(stories[si][1])}function nextStory(){si=(si+1)%stories.length;renderStory();if(si===0)celebrate('¡Qué bonito cuento!')}const emos=[['😊','contento'],['😢','triste'],['😠','enfadado'],['😮','sorprendido']];let em;function newEmotion(){em=emos[Math.floor(Math.random()*emos.length)];let opts=emos.map(x=>x[1]).sort(()=>Math.random()-.5);games.innerHTML=`<div class="game on"><div class="prompt">¿Cómo se siente?</div><div class="face">${em[0]}</div><div class="answers">${opts.map(x=>`<button class="ans" onclick="pickEmotion('${x}')">${x}</button>`).join('')}</div></div>`;say('¿Cómo se siente?')}function pickEmotion(x){x===em[1]?(celebrate('¡Eso es! Se siente '+x),setTimeout(newEmotion,700)):gentle('Mira su cara otra vez')}let ink='#8b6ee8',ctx,drawing=false;function drawGame(){games.innerHTML=`<div class="game on"><div class="prompt">Dibuja lo que imagines</div><div class="palette">${['#ff5364','#379fea','#57cf69','#ffd84d','#8b6ee8'].map(c=>`<button class="sw" style="background:${c}" onclick="ink='${c}'"></button>`).join('')}</div><canvas id="canvas" class="canvas"></canvas></div>`;say('Dibuja lo que imagines');setTimeout(setupCanvas,0)}function setupCanvas(){const c=canvas,r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineWidth=12;ctx.lineCap='round';c.onpointerdown=e=>{drawing=true;const q=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-q.left,e.clientY-q.top)};c.onpointermove=e=>{if(!drawing)return;const q=c.getBoundingClientRect();ctx.strokeStyle=ink;ctx.lineTo(e.clientX-q.left,e.clientY-q.top);ctx.stroke()};c.onpointerup=c.onpointerleave=()=>drawing=false}const letters=[['A','ABEJA'],['M','MIMO'],['S','SOL'],['P','PIPA'],['L','LÍO']];let lt;function newLetter(){lt=letters[Math.floor(Math.random()*letters.length)];let opts=[lt[0],...letters.filter(x=>x[0]!==lt[0]).slice(0,2).map(x=>x[0])].sort(()=>Math.random()-.5);games.innerHTML=`<div class="game on"><div class="prompt">¿Con qué letra empieza ${lt[1]}?</div><div class="bigLetter">${lt[0]}</div><div class="answers">${opts.map(x=>`<button class="ans" onclick="pickLetter('${x}')">${x}</button>`).join('')}</div></div>`;say('¿Con qué letra empieza '+lt[1]+'?')}function pickLetter(x){x===lt[0]?(celebrate('¡Correcto! '+lt[0]),setTimeout(newLetter,700)):gentle('Prueba otra letra')}const pats=[[['🟡','🩷','🟡'],'🩷',['🩷','🔵','🟢']],[['▲','■','▲'],'■',['●','■','★']],[['1','2','3'],'4',['4','5','2']]];let lg;function newLogic(){lg=pats[Math.floor(Math.random()*pats.length)];games.innerHTML=`<div class="game on"><div class="prompt">¿Qué viene después?</div><div class="pattern">${lg[0].join(' ')} ?</div><div class="answers">${lg[2].map(x=>`<button class="ans" onclick="pickLogic('${x}')">${x}</button>`).join('')}</div></div>`;say('¿Qué viene después?')}function pickLogic(x){x===lg[1]?(celebrate('¡Muy bien!'),setTimeout(newLogic,700)):gentle('Mira el patrón otra vez')}const sorts=[['🐶','animal'],['🐸','animal'],['🍎','comida'],['🍌','comida'],['🎒','objeto'],['🧸','objeto']];let st;function newSort(){st=sorts[Math.floor(Math.random()*sorts.length)];games.innerHTML=`<div class="game on"><div class="prompt">¿Dónde va?</div><div class="sortItem">${st[0]}</div><div class="answers"><button class="ans" onclick="pickSort('animal')">ANIMAL</button><button class="ans" onclick="pickSort('comida')">COMIDA</button><button class="ans" onclick="pickSort('objeto')">OBJETO</button></div></div>`;say('¿Dónde va?')}function pickSort(x){x===st[1]?(celebrate('¡Bien clasificado!'),setTimeout(newSort,700)):gentle('Prueba otra categoría')}if('speechSynthesis'in window)speechSynthesis.getVoices();MimoAudio.warm();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
