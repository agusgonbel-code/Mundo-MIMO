<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765de8"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#f3efff;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #d8d0ee}.scene{position:relative;height:480px;border-radius:34px;overflow:hidden;background:linear-gradient(#b8e9ff 0 42%,#b8a1f0 42% 100%);box-shadow:0 8px 0 #d8d0ee}.mount{position:absolute;left:12%;right:12%;bottom:-8%;height:58%;background:#8067d9;clip-path:polygon(0 100%,20% 45%,36% 74%,55% 18%,73% 62%,100% 28%,100% 100%)}.snow{position:absolute;left:47%;top:36%;font-size:72px}.mimo{position:absolute;width:145px;left:6%;bottom:4%;z-index:4;animation:bob 2.2s infinite}.flag{position:absolute;right:12%;top:24%;font-size:70px}.star{position:absolute;border:0;background:#fff;border-radius:24px;padding:10px 15px;font-size:40px;font-weight:1000;box-shadow:0 5px 0 #0002}.s1{left:27%;top:18%}.s2{left:47%;top:11%}.s3{right:21%;top:39%}.seq{position:absolute;left:26%;bottom:19%;display:flex;gap:9px}.tile{width:60px;height:60px;border:5px solid #fff;border-radius:18px;display:grid;place-items:center;font-size:30px;box-shadow:0 5px 0 #0002}.t1{background:#ffd84d}.t2{background:#ff8fb5}.t3{background:#ffd84d}.q{background:#fff}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:0;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:16px;box-shadow:0 5px 0 #0001}.a1{background:#fff0a6}.a2{background:#d4c7ff}.a3{background:#ffd4e1}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.scene{height:425px}.mimo{width:118px}.star{font-size:32px}.actions{grid-template-columns:1fr}.seq{left:18%;bottom:16%}.tile{width:52px;height:52px}}</style></head><body><div class="wrap"><div class="top"><h2>⭐ Monte Aventura</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><div class="mount"></div><span class="snow">❄️</span><img class="mimo" src="./mimo-bear.svg" alt="Mimo" onclick="say('Subimos poco a poco. Aquí jugamos con letras, lógica y secuencias')"><span class="flag">🚩</span><button class="star s1" onclick="discover('A de abeja')">A</button><button class="star s2" onclick="discover('M de Mimo')">M</button><button class="star s3" onclick="discover('S de sol')">S</button><div class="seq"><button class="tile t1" onclick="discover('Amarillo')">●</button><button class="tile t2" onclick="discover('Rosa')">●</button><button class="tile t3" onclick="discover('Amarillo')">●</button><button class="tile q" onclick="discover('¿Qué color sigue? Rosa')">?</button></div></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¡Subimos aprendiendo!</b><div id="desc">Toca letras y patrones. Los retos se hacen más complejos poco a poco.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('letters')">🔤 Letras</button><button class="action a2" onclick="openGame('puzzle')">🧩 Lógica</button><button class="action a3" onclick="openGame('classify')">🧺 Clasificar</button></div></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}function discover(t){title.textContent=t;desc.textContent='¡Bien! Sigue explorando Monte Aventura.';say(t)}function openGame(target){sessionStorage.setItem('mimoTarget',target);location.href='../index.html?game='+encodeURIComponent(target)}</script></body></html>
