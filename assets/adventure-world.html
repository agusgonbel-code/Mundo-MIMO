<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monte Aventura</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#9fdfff,#7358e7);color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:4px solid #fff;border-radius:18px;background:#ffe052;padding:9px 13px;font-weight:1000;color:#4d347d;box-shadow:0 5px 0 #9b6700}.scene{margin-top:10px;border:6px solid #fff;border-radius:34px;background:linear-gradient(#c9efff,#c0aff3);box-shadow:0 9px 0 #40318b;padding:16px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}.heroText{color:#34405f}.heroText h1{font-size:31px;margin:0 0 7px;color:#5138ae}.heroText p{font-weight:900;margin:0}.hero img{width:100%;max-height:235px;object-fit:contain;filter:drop-shadow(0 9px 0 #0002)}.challenges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.challenge{border:5px solid #fff;border-radius:25px;background:#ffffffed;box-shadow:0 6px 0 #44337e;padding:14px;color:#3e416d;text-align:center}.challenge strong{font-size:52px;display:block}.challenge b{display:block;font-size:12px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.action{border:5px solid #fff;border-radius:22px;padding:14px 7px;font-weight:1000;box-shadow:0 6px 0 #44337e;color:#373165}.a1{background:#fff0a4}.a2{background:#d3c6ff}.a3{background:#ffd0df}@media(max-width:560px){.hero{grid-template-columns:1fr}.hero img{max-height:175px}.challenges{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>⭐ MONTE AVENTURA</h2><button class="back" onclick="location.href='../app-v28.html'">← INICIO</button></div><section class="scene"><div class="hero"><div class="heroText"><h1>Retos para seguir creciendo</h1><p>Letras, patrones y clasificación sin elementos flotando unos encima de otros.</p></div><img src="./mimo-bear.svg" alt="Mimo"></div><div class="challenges"><button class="challenge" onclick="openGame('letters')"><strong>A</strong><b>LETRAS</b></button><button class="challenge" onclick="openGame('logic')"><strong>● ★ ● ?</strong><b>LÓGICA</b></button><button class="challenge" onclick="openGame('sort')"><strong>🧺</strong><b>CLASIFICAR</b></button></div></section><div class="actions"><button class="action a1" onclick="openGame('letters')">🔤 LETRAS</button><button class="action a2" onclick="openGame('logic')">🧩 LÓGICA</button><button class="action a3" onclick="openGame('sort')">🧺 CLASIFICAR</button></div></div><script>function openGame(id){location.href='./adventure-games.html#'+id}</script></body></html>
