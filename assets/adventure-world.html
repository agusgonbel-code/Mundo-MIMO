<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765de8"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#f3efff;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #d8d0ee}.scene{position:relative;height:460px;border-radius:34px;overflow:hidden;background:linear-gradient(#b8e9ff 0 42%,#b8a1f0 42% 100%);box-shadow:0 8px 0 #d8d0ee}.mount{position:absolute;left:12%;right:12%;bottom:-8%;height:58%;background:#8067d9;clip-path:polygon(0 100%,20% 45%,36% 74%,55% 18%,73% 62%,100% 28%,100% 100%)}.mimo{position:absolute;width:135px;left:7%;bottom:4%;z-index:4;animation:bob 2.2s infinite}.flag{position:absolute;right:10%;top:25%;font-size:60px}.star{position:absolute;border:5px solid #fff;background:#fff;border-radius:24px;padding:9px 14px;font-size:36px;font-weight:1000;box-shadow:0 5px 0 #0002}.s1{left:28%;top:18%;background:#ffe36c}.s2{left:48%;top:11%;background:#ffabc8}.s3{right:20%;top:39%;background:#9de7b2}.seq{position:absolute;left:28%;bottom:18%;display:flex;gap:8px}.tile{width:56px;height:56px;border:5px solid #fff;border-radius:18px;display:grid;place-items:center;font-size:28px;box-shadow:0 5px 0 #0002}.t1,.t3{background:#ffd84d}.t2{background:#ff8fb5}.q{background:#fff}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:4px solid #fff;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:16px;box-shadow:0 5px 0 #75609e}.a1{background:#fff0a6}.a2{background:#d4c7ff}.a3{background:#ffd4e1}.note{font-size:13px;color:#70758a}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.scene{height:400px}.mimo{width:105px}.star{font-size:28px}.seq{left:18%;bottom:14%}.tile{width:48px;height:48px}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>⭐ Monte Aventura</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><div class="mount"></div><img class="mimo" src="./mimo-bear.svg" alt="Mimo"><span class="flag">🚩</span><button class="star s1" onclick="discover('A de abeja')">A</button><button class="star s2" onclick="discover('M de Mimo')">M</button><button class="star s3" onclick="discover('S de sol')">S</button><div class="seq"><button class="tile t1" onclick="discover('Amarillo')">●</button><button class="tile t2" onclick="discover('Rosa')">●</button><button class="tile t3" onclick="discover('Amarillo')">●</button><button class="tile q" onclick="discover('¿Qué viene después?')">?</button></div></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¡Subimos aprendiendo!</b><div id="desc">Toca letras y patrones o entra en un juego.</div><div class="note">Sin narración sintética automática.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('letters')">🔤 Letras</button><button class="action a2" onclick="openGame('logic')">🧩 Lógica</button><button class="action a3" onclick="openGame('sort')">🧺 Clasificar</button></div></div><script>function discover(t){title.textContent=t;desc.textContent='Puedes seguir explorando o entrar en un juego.'}function openGame(target){location.href='./adventure-games.html#'+target}</script></body></html>
