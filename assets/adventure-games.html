<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#765de8"><title>Monte Aventura · Juegos</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#9fdfff,#7358e7);color:#30365f;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff}.back{border:4px solid #fff;background:#ffe052;border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px #a46800}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.tab{border:4px solid #fff;border-radius:20px;padding:12px 5px;font-weight:1000;box-shadow:0 5px #35297d}.tab:nth-child(1){background:#fff0a4}.tab:nth-child(2){background:#d3c6ff}.tab:nth-child(3){background:#ffd0df}.game{display:none;background:#f8f5ff;border:5px solid #fff;border-radius:32px;padding:15px;box-shadow:0 8px #35297d;min-height:510px}.game.on{display:block}.hero{display:flex;align-items:center;justify-content:center;gap:12px}.hero img{width:100px}.hero b{font-size:23px;color:#5039b0}.big{font-size:150px;text-align:center;font-weight:1000;color:#654fe0}.prompt{text-align:center;font-size:24px;font-weight:1000;margin:12px}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:560px;margin:auto}.ans{border:4px solid #fff;border-radius:22px;padding:15px;font-size:28px;font-weight:1000;box-shadow:0 5px #c3badb;background:#fff}.pattern{display:flex;justify-content:center;gap:10px;font-size:48px;margin:30px 0}.feedback{text-align:center;min-height:34px;font-size:22px;font-weight:1000;color:#5039b0}@media(max-width:520px){.tabs{grid-template-columns:1fr}.game{min-height:460px}.hero img{width:78px}.big{font-size:115px}.answers{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><h2>⭐ JUEGOS DEL MONTE</h2><button class="back" onclick="location.href='./adventure-world.html'">← MONTE</button></div><div class="tabs"><button class="tab" onclick="show('letters')">🔤 LETRAS</button><button class="tab" onclick="show('logic')">🧩 LÓGICA</button><button class="tab" onclick="show('sort')">🧺 CLASIFICAR</button></div><section id="letters" class="game on"><div class="hero"><img src="./mimo-bear.svg"><b>Encuentra la letra</b></div><div id="letterBig" class="big"></div><div id="letterPrompt" class="prompt"></div><div id="letterAnswers" class="answers"></div><div id="letterFeedback" class="feedback"></div></section><section id="logic" class="game"><div class="hero"><img src="./mimo-bear.svg"><b>Completa el patrón</b></div><div id="pattern" class="pattern"></div><div id="logicAnswers" class="answers"></div><div id="logicFeedback" class="feedback"></div></section><section id="sort" class="game"><div class="hero"><img src="./mimo-bear.svg"><b>¿Dónde va?</b></div><div id="sortBig" class="big"></div><div class="answers"><button class="ans" onclick="pickSort('animal')">🐾 ANIMAL</button><button class="ans" onclick="pickSort('comida')">🍎 COMIDA</button><button class="ans" onclick="pickSort('objeto')">🎒 OBJETO</button></div><div id="sortFeedback" class="feedback"></div></section></div><script>function tone(ok=true){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?700:210;g.gain.setValueAtTime(.08,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.23)}function show(id){document.querySelectorAll('.game').forEach(x=>x.classList.toggle('on',x.id===id));if(id==='letters')newLetter();if(id==='logic')newLogic();if(id==='sort')newSort()}const letters=[['A','ABEJA'],['M','MIMO'],['S','SOL'],['P','PIPA'],['L','LÍO'],['O','OSO']];let lt;function newLetter(){lt=letters[Math.floor(Math.random()*letters.length)];letterBig.textContent=lt[0];letterPrompt.textContent='¿Con qué letra empieza '+lt[1]+'?';let opts=[lt[0],...letters.filter(x=>x[0]!==lt[0]).sort(()=>Math.random()-.5).slice(0,2).map(x=>x[0])].sort(()=>Math.random()-.5);letterAnswers.innerHTML=opts.map(x=>`<button class="ans" onclick="pickLetter('${x}')">${x}</button>`).join('');letterFeedback.textContent=''}function pickLetter(x){if(x===lt[0]){letterFeedback.textContent='⭐ ¡Correcto!';tone(true);setTimeout(newLetter,650)}else{letterFeedback.textContent='Prueba otra letra';tone(false)}}const patterns=[[['🟡','🩷','🟡'],'🩷',['🩷','🔵','🟢']],[['▲','■','▲'],'■',['●','■','★']],[['1','2','3'],'4',['4','5','2']]];let lg;function newLogic(){lg=patterns[Math.floor(Math.random()*patterns.length)];pattern.innerHTML=lg[0].map(x=>`<span>${x}</span>`).join('')+'<span>?</span>';logicAnswers.innerHTML=lg[2].sort(()=>Math.random()-.5).map(x=>`<button class="ans" onclick="pickLogic('${x}')">${x}</button>`).join('');logicFeedback.textContent=''}function pickLogic(x){if(x===lg[1]){logicFeedback.textContent='⭐ ¡Muy bien!';tone(true);setTimeout(newLogic,650)}else{logicFeedback.textContent='Mira el patrón otra vez';tone(false)}}const sorts=[['🐶','animal'],['🐸','animal'],['🍎','comida'],['🍌','comida'],['🎒','objeto'],['🧸','objeto']];let st;function newSort(){st=sorts[Math.floor(Math.random()*sorts.length)];sortBig.textContent=st[0];sortFeedback.textContent=''}function pickSort(x){if(x===st[1]){sortFeedback.textContent='⭐ ¡Bien clasificado!';tone(true);setTimeout(newSort,650)}else{sortFeedback.textContent='Prueba otra categoría';tone(false)}}newLetter();newLogic();newSort();</script></body></html>
