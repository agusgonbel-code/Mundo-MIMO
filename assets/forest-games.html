<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35b75b"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#59d7ff,#48c96a);color:#27315a;min-height:100vh}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 3px #176b49}.back{border:4px solid #fff;background:#ffd84b;border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px #a46a00}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.tab{border:4px solid #fff;border-radius:20px;padding:12px 5px;font-weight:1000;box-shadow:0 5px #2d287c}.tab:nth-child(1){background:#ffe04e}.tab:nth-child(2){background:#72e594}.tab:nth-child(3){background:#66cfff}.game{display:none;background:#f8fff3;border:5px solid #fff;border-radius:32px;padding:14px;box-shadow:0 8px #217c49}.game.on{display:block}.stage{text-align:center;min-height:390px;background:linear-gradient(#bcefff 0 48%,#8de284 48%);border-radius:26px;padding:8px}.hero{width:250px;height:250px;object-fit:contain;filter:drop-shadow(0 10px 0 #0002);animation:bob 2s infinite}.name{display:block;font-size:30px;font-weight:1000;background:#fff;border-radius:18px;padding:7px 15px;width:max-content;margin:-8px auto 8px}.listen{border:4px solid #fff;background:#7059e9;color:#fff;border-radius:22px;padding:13px 22px;font-weight:1000;box-shadow:0 5px #3e32a1}.row{display:flex;gap:8px;overflow:auto;padding:12px 2px}.pick{min-width:100px;height:100px;border:5px solid #fff;background:#fff;border-radius:24px;box-shadow:0 5px #2d287c}.pick img{width:88px;height:88px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:5px solid #fff;border-radius:23px;background:#7059e9;box-shadow:0 5px #3e32a1;padding:5px}.card img{width:100%;height:100%;object-fit:contain;visibility:hidden}.card.open,.card.done{background:#fff}.card.open img,.card.done img{visibility:visible}.prompt{text-align:center;font-size:22px;font-weight:1000;margin:5px 0 15px}.soundChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sound{border:5px solid #fff;background:#fff;border-radius:27px;padding:10px;box-shadow:0 6px #2d287c}.sound img{width:135px;height:135px;object-fit:contain}.sound b{display:block;font-size:20px}.stars{text-align:center;font-size:22px;font-weight:1000;margin:10px}.status{text-align:center;min-height:30px;font-weight:1000;color:#4d3baa}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.tabs{grid-template-columns:1fr}.hero{width:210px;height:210px}.cards{grid-template-columns:repeat(3,1fr)}.sound img{width:105px;height:105px}.stage{min-height:340px}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 Juegos de Lío</h2><button class="back" onclick="location.href='./forest-world.html'">← BOSQUE</button></div><div class="tabs"><button class="tab" onclick="show('safari')">🔊 SAFARI</button><button class="tab" onclick="show('pairs')">🧠 PAREJAS</button><button class="tab" onclick="show('sounds')">🎵 ¿QUIÉN SUENA?</button></div><div id="safari" class="game"><div class="stage"><img id="hero" class="hero" src="./dog-mimo.svg"><span id="name" class="name">Perro</span><button class="listen" onclick="playCurrent()">🔊 SONIDO REAL</button><div id="safariStatus" class="status"></div></div><div id="row" class="row"></div></div><div id="pairs" class="game"><div class="prompt">Encuentra dos personajes iguales</div><div id="cards" class="cards"></div><div id="pairStars" class="stars">⭐ 0</div></div><div id="sounds" class="game"><div id="soundPrompt" class="prompt">Escucha una grabación y toca el personaje correcto</div><button class="listen" style="display:block;margin:0 auto 15px" onclick="askSound()">🔊 ESCUCHAR PISTA</button><div id="soundChoices" class="soundChoices"></div><div id="soundStars" class="stars">⭐ 0</div><div id="soundStatus" class="status"></div></div></div><script>const AUDIO={dog:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Perro_ladrando.ogg',cat:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Meow_of_a_pleading_cat.oga',cow:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Single_Cow_Moo.ogg'};const A=[['Perro','dog-mimo.svg',AUDIO.dog],['Gato','cat-mimo.svg',AUDIO.cat],['Vaca','cow-mimo.svg',AUDIO.cow],['Rana','frog-mimo.svg',null],['Lío','lio-lion.svg',null]];let current=0,pairScore=0,soundScore=0,target=0,audio=null;function tone(ok=true){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?700:210;g.gain.setValueAtTime(.07,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.21)}function play(url,statusEl){if(!url){statusEl.textContent='Este sonido real se añadirá cuando tengamos una grabación adecuada.';return}if(audio){audio.pause();audio=null}statusEl.textContent='';audio=new Audio(url);audio.volume=.9;audio.play().catch(()=>statusEl.textContent='No se pudo cargar la grabación. Prueba con conexión a internet.')}function show(id){if(!['safari','pairs','sounds'].includes(id))id='safari';document.querySelectorAll('.game').forEach(x=>x.classList.toggle('on',x.id===id));location.hash=id;if(id==='pairs')deal();if(id==='sounds')renderSounds()}function choose(i){current=i;hero.src='./'+A[i][1];name.textContent=A[i][0];safariStatus.textContent=A[i][2]?'Grabación real disponible':'Grabación real pendiente'}function playCurrent(){play(A[current][2],safariStatus)}row.innerHTML=A.map((a,i)=>`<button class="pick" onclick="choose(${i})"><img src="./${a[1]}" alt="${a[0]}"></button>`).join('');let first=null,lock=false;function deal(){let deck=[0,0,1,1,2,2,3,3,4,4].sort(()=>Math.random()-.5);cards.innerHTML=deck.map((x,i)=>`<button class="card" data-a="${x}" onclick="flip(this)"><img src="./${A[x][1]}"></button>`).join('');first=null;lock=false}function flip(el){if(lock||el.classList.contains('done')||el===first)return;el.classList.add('open');if(!first){first=el;return}if(first.dataset.a===el.dataset.a){first.classList.add('done');el.classList.add('done');first=null;pairScore++;pairStars.textContent='⭐ '+pairScore;tone(true)}else{lock=true;let a=first;setTimeout(()=>{a.classList.remove('open');el.classList.remove('open');first=null;lock=false},650)}}const S=A.slice(0,3);function renderSounds(){soundChoices.innerHTML=S.map((a,i)=>`<button class="sound" onclick="answerSound(${i})"><img src="./${a[1]}"><b>${a[0]}</b></button>`).join('');askSound()}function askSound(){target=Math.floor(Math.random()*S.length);soundStatus.textContent='';play(S[target][2],soundStatus)}function answerSound(i){if(i===target){soundScore++;soundStars.textContent='⭐ '+soundScore;soundStatus.textContent='¡Muy bien!';tone(true);setTimeout(askSound,700)}else{soundStatus.textContent='Prueba otra vez';tone(false)}}let initial=location.hash.replace('#','')||'safari';show(initial);window.addEventListener('hashchange',()=>show(location.hash.replace('#','')))</script></body></html>
