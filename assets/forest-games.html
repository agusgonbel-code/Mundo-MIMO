<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35b75b"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#59d7ff,#48c96a);color:#27315a;min-height:100vh}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 3px #176b49}.back{border:4px solid #fff;background:#ffd84b;border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px #a46a00}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.tab{border:4px solid #fff;border-radius:20px;padding:12px 5px;font-weight:1000;box-shadow:0 5px #2d287c}.tab:nth-child(1){background:#ffe04e}.tab:nth-child(2){background:#72e594}.tab:nth-child(3){background:#66cfff}.game{display:none;background:#f8fff3;border:5px solid #fff;border-radius:32px;padding:14px;box-shadow:0 8px #217c49}.game.on{display:block}.stage{text-align:center;min-height:410px;background:linear-gradient(#bcefff 0 48%,#8de284 48%);border-radius:26px;padding:8px}.hero{width:270px;height:270px;object-fit:contain;filter:drop-shadow(0 10px 0 #0002);animation:bob 2s infinite}.name{display:block;font-size:30px;font-weight:1000;background:#fff;border-radius:18px;padding:7px 15px;width:max-content;margin:-8px auto 8px}.listen{border:4px solid #fff;background:#7059e9;color:#fff;border-radius:22px;padding:13px 22px;font-weight:1000;box-shadow:0 5px #3e32a1}.row{display:flex;gap:8px;overflow:auto;padding:12px 2px}.pick{min-width:100px;height:100px;border:5px solid #fff;background:#fff;border-radius:24px;box-shadow:0 5px #2d287c}.pick img{width:88px;height:88px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:5px solid #fff;border-radius:23px;background:#7059e9;box-shadow:0 5px #3e32a1;padding:5px}.card img{width:100%;height:100%;object-fit:contain;visibility:hidden}.card.open,.card.done{background:#fff}.card.open img,.card.done img{visibility:visible}.prompt{text-align:center;font-size:22px;font-weight:1000;margin:5px 0 15px}.soundChoices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sound{border:5px solid #fff;background:#fff;border-radius:27px;padding:10px;box-shadow:0 6px #2d287c}.sound img{width:145px;height:145px;object-fit:contain}.sound b{display:block;font-size:20px}.stars{text-align:center;font-size:22px;font-weight:1000;margin:10px}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.tabs{grid-template-columns:1fr}.hero{width:230px;height:230px}.cards{grid-template-columns:repeat(3,1fr)}.sound img{width:110px;height:110px}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 Juegos de Lío</h2><button class="back" onclick="location.href='./forest-world.html'">← BOSQUE</button></div><div class="tabs"><button class="tab" onclick="show('safari')">🔊 SAFARI</button><button class="tab" onclick="show('pairs')">🧠 PAREJAS</button><button class="tab" onclick="show('sounds')">🎵 ¿QUIÉN SUENA?</button></div><div id="safari" class="game on"><div class="stage"><img id="hero" class="hero" src="./dog-mimo.svg"><span id="name" class="name">Perro</span><button class="listen" onclick="speakCurrent()">🔊 ESCUCHAR</button></div><div id="row" class="row"></div></div><div id="pairs" class="game"><div class="prompt">Encuentra dos personajes iguales</div><div id="cards" class="cards"></div><div id="pairStars" class="stars">⭐ 0</div></div><div id="sounds" class="game"><div id="soundPrompt" class="prompt">Escucha y toca el personaje correcto</div><button class="listen" style="display:block;margin:0 auto 15px" onclick="askSound()">🔊 ESCUCHAR PISTA</button><div id="soundChoices" class="soundChoices"></div><div id="soundStars" class="stars">⭐ 0</div></div></div><script>const A=[['Perro','dog-mimo.svg','guau'],['Gato','cat-mimo.svg','miau'],['Vaca','cow-mimo.svg','muuu'],['Rana','frog-mimo.svg','croac'],['Lío','lio-lion.svg','rugido']];let current=0,pairScore=0,soundScore=0,target=0;function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.75;u.pitch=1.08;speechSynthesis.speak(u)}function show(id){document.querySelectorAll('.game').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(id==='pairs')deal();if(id==='sounds')renderSounds()}function choose(i){current=i;hero.src='./'+A[i][1];name.textContent=A[i][0];say(A[i][0])}function speakCurrent(){say(A[current][0]+'. '+A[current][2])}row.innerHTML=A.map((a,i)=>`<button class="pick" onclick="choose(${i})"><img src="./${a[1]}" alt="${a[0]}"></button>`).join('');let first=null,lock=false;function deal(){let deck=[0,0,1,1,2,2,3,3,4,4].sort(()=>Math.random()-.5);cards.innerHTML=deck.map((x,i)=>`<button class="card" data-a="${x}" onclick="flip(this)"><img src="./${A[x][1]}"></button>`).join('')}function flip(el){if(lock||el.classList.contains('done')||el===first)return;el.classList.add('open');if(!first){first=el;return}if(first.dataset.a===el.dataset.a){first.classList.add('done');el.classList.add('done');first=null;pairScore++;pairStars.textContent='⭐ '+pairScore;say('¡Pareja!')}else{lock=true;let a=first;setTimeout(()=>{a.classList.remove('open');el.classList.remove('open');first=null;lock=false},650)}}function renderSounds(){soundChoices.innerHTML=A.slice(0,4).map((a,i)=>`<button class="sound" onclick="answerSound(${i})"><img src="./${a[1]}"><b>${a[0]}</b></button>`).join('');askSound()}function askSound(){target=Math.floor(Math.random()*4);say('¿Quién hace '+A[target][2]+'?')}function answerSound(i){if(i===target){soundScore++;soundStars.textContent='⭐ '+soundScore;say('¡Muy bien! '+A[i][0]);setTimeout(askSound,700)}else say('Prueba otra vez')}deal();</script></body></html>
