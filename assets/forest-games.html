<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juegos de Lío</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#59d7ff,#48c96a);color:#27315a;min-height:100vh}button{font:inherit}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff}.back{border:4px solid #fff;background:#ffd84b;border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px #a46a00}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0}.tab{border:4px solid #fff;border-radius:20px;padding:12px 5px;font-weight:1000;box-shadow:0 5px #2d287c}.tab:nth-child(1){background:#ffe04e}.tab:nth-child(2){background:#72e594}.tab:nth-child(3){background:#66cfff}.game{display:none;background:#f8fff3;border:5px solid #fff;border-radius:32px;padding:14px;box-shadow:0 8px #217c49}.game.on{display:block}.stage{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;background:linear-gradient(#bcefff,#8de284);border-radius:26px;padding:14px}.hero{width:100%;max-height:280px;object-fit:contain}.stageText{text-align:center}.name{font-size:30px;font-weight:1000;background:#fff;border-radius:18px;padding:7px 15px;display:inline-block}.listen{border:4px solid #fff;background:#7059e9;color:#fff;border-radius:22px;padding:13px 22px;font-weight:1000;box-shadow:0 5px #3e32a1;margin-top:12px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.pick{border:5px solid #fff;background:#fff;border-radius:24px;box-shadow:0 5px #2d287c;padding:3px}.pick img{width:100%;height:90px;object-fit:contain}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{aspect-ratio:1;border:5px solid #fff;border-radius:23px;background:#7059e9;box-shadow:0 5px #3e32a1;padding:5px}.card img{width:100%;height:100%;object-fit:contain;visibility:hidden}.card.open,.card.done{background:#fff}.card.open img,.card.done img{visibility:visible}.prompt{text-align:center;font-size:22px;font-weight:1000;margin:5px 0 15px}.soundChoices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sound{border:5px solid #fff;background:#fff;border-radius:27px;padding:10px;box-shadow:0 6px #2d287c}.sound img{width:100%;height:145px;object-fit:contain}.sound b{display:block;font-size:20px}.stars,.status{text-align:center;font-weight:1000;margin:10px}.stars{font-size:22px}.status{min-height:30px;color:#4d3baa}@media(max-width:560px){.tabs{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.hero{max-height:210px}.row{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.soundChoices{grid-template-columns:1fr 1fr}.sound img{height:110px}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 JUEGOS DE LÍO</h2><button class="back" onclick="location.href='./forest-world.html'">← BOSQUE</button></div><div class="tabs"><button class="tab" onclick="show('safari')">🔊 SAFARI</button><button class="tab" onclick="show('pairs')">🧠 PAREJAS</button><button class="tab" onclick="show('sounds')">🎵 ¿QUIÉN SUENA?</button></div><div id="safari" class="game"><div class="stage"><img id="hero" class="hero" src="./dog-mimo.svg"><div class="stageText"><span id="name" class="name">Perro</span><div><button id="listenBtn" class="listen" onclick="playCurrent()">🔊 SONIDO REAL</button></div><div id="safariStatus" class="status">Grabación precargada</div></div></div><div id="row" class="row"></div></div><div id="pairs" class="game"><div class="prompt">Encuentra dos personajes iguales</div><div id="cards" class="cards"></div><div id="pairStars" class="stars">⭐ 0</div></div><div id="sounds" class="game"><div class="prompt">Escucha la grabación real y toca el personaje correcto</div><button class="listen" style="display:block;margin:0 auto 15px" onclick="askSound()">🔊 ESCUCHAR PISTA</button><div id="soundChoices" class="soundChoices"></div><div id="soundStars" class="stars">⭐ 0</div><div id="soundStatus" class="status"></div></div></div><script src="./audio-bank.js"></script><script>const A=[['Perro','dog-mimo.svg','dog'],['Vaca','cow-mimo.svg','cow'],['Rana','frog-mimo.svg','frog'],['Gato','cat-mimo.svg',null],['Lío','lio-lion.svg',null]];let current=0,pairScore=0,soundScore=0,target=0;function show(id){if(!['safari','pairs','sounds'].includes(id))id='safari';document.querySelectorAll('.game').forEach(x=>x.classList.toggle('on',x.id===id));location.hash=id;if(id==='pairs')deal();if(id==='sounds')renderSounds()}function choose(i){current=i;hero.src='./'+A[i][1];name.textContent=A[i][0];safariStatus.textContent=A[i][2]?'Grabación real disponible':'Aún no hay una grabación real seleccionada';listenBtn.disabled=!A[i][2]}function playCurrent(){const k=A[current][2];if(!k)return;safariStatus.textContent=MimoAudio.ready(k)?'Reproduciendo…':'Preparando audio…';MimoAudio.play(k).then(()=>safariStatus.textContent='🔊 '+A[current][0]).catch(()=>safariStatus.textContent='No se pudo reproducir la grabación')}row.innerHTML=A.map((a,i)=>`<button class="pick" onclick="choose(${i})"><img src="./${a[1]}" alt="${a[0]}"></button>`).join('');let first=null,lock=false;function deal(){let deck=[0,0,1,1,2,2,3,3,4,4].sort(()=>Math.random()-.5);cards.innerHTML=deck.map(x=>`<button class="card" data-a="${x}" onclick="flip(this)"><img src="./${A[x][1]}"></button>`).join('');first=null;lock=false}function flip(el){if(lock||el.classList.contains('done')||el===first)return;el.classList.add('open');if(!first){first=el;return}if(first.dataset.a===el.dataset.a){first.classList.add('done');el.classList.add('done');first=null;pairScore++;pairStars.textContent='⭐ '+pairScore}else{lock=true;let a=first;setTimeout(()=>{a.classList.remove('open');el.classList.remove('open');first=null;lock=false},650)}}const S=A.slice(0,3);function renderSounds(){soundChoices.innerHTML=S.map((a,i)=>`<button class="sound" onclick="answerSound(${i})"><img src="./${a[1]}"><b>${a[0]}</b></button>`).join('');askSound()}function askSound(){target=Math.floor(Math.random()*S.length);soundStatus.textContent=MimoAudio.ready(S[target][2])?'Escucha…':'Preparando grabación…';MimoAudio.play(S[target][2]).then(()=>soundStatus.textContent='¿Quién ha sonado?').catch(()=>soundStatus.textContent='Error al reproducir la grabación')}function answerSound(i){if(i===target){soundScore++;soundStars.textContent='⭐ '+soundScore;soundStatus.textContent='✨ ¡Correcto!';setTimeout(askSound,750)}else soundStatus.textContent='Prueba otro personaje'}MimoAudio.warm();choose(0);let initial=location.hash.replace('#','')||'safari';show(initial);window.addEventListener('hashchange',()=>show(location.hash.replace('#','')))</script></body></html>
