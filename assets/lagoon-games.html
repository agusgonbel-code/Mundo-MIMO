<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#279ee8"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#6be2ff,#4f59d9);color:#24345d;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:white;text-shadow:0 3px 0 #1b4c8c}.back{border:4px solid white;background:linear-gradient(#ffe44e,#ff9d17);border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px 0 #9d6500}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.tab{border:4px solid white;border-radius:22px;padding:13px 8px;font-weight:1000;box-shadow:0 6px 0 #302781}.t1{background:#ffe04d}.t2{background:#ff9fc8}.t3{background:#80dfff}.game{display:none;background:linear-gradient(#eafcff,#c5efff);border:6px solid white;border-radius:34px;padding:18px;box-shadow:0 9px 0 #2e2a83;min-height:520px}.game.on{display:block}.hero{display:flex;gap:12px;align-items:center;justify-content:center;margin-bottom:10px}.hero img{width:105px}.hero b{font-size:24px;color:#4938aa}.pond{text-align:center;background:linear-gradient(#79e7ff,#31afd8);border-radius:28px;padding:22px;min-height:250px}.fishRow{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;min-height:135px;align-items:center}.fish{font-size:68px;filter:drop-shadow(0 5px 0 #0002)}.answers,.colorGrid,.shapeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;margin:16px auto}.ans{border:4px solid white;border-radius:22px;padding:15px;font-size:30px;font-weight:1000;box-shadow:0 5px 0 #2e2a83;background:white}.color{height:120px;border:7px solid white;border-radius:28px;box-shadow:0 6px 0 #2e2a83}.shape{height:130px;border:7px solid white;border-radius:28px;background:white;box-shadow:0 6px 0 #2e2a83;display:grid;place-items:center;font-size:76px}.prompt{text-align:center;font-size:26px;font-weight:1000;margin:10px}.reward{text-align:center;font-size:22px;font-weight:1000;min-height:32px;color:#4332a4}@media(max-width:520px){.tabs{grid-template-columns:1fr}.game{min-height:470px}.fish{font-size:54px}.answers,.colorGrid,.shapeGrid{grid-template-columns:repeat(2,1fr)}.color{height:100px}.shape{height:110px}}</style></head><body><div class="wrap"><div class="top"><h2>💦 JUEGOS DE PIPA</h2><button class="back" onclick="location.href='./lagoon-world.html'">← LAGUNA</button></div><div class="tabs"><button class="tab t1" onclick="showGame('count')">🔢 CONTAR</button><button class="tab t2" onclick="showGame('colors')">🌈 COLORES</button><button class="tab t3" onclick="showGame('shapes')">🔷 FORMAS</button></div><section id="count" class="game"><div class="hero"><img src="./pipa-elephant.svg" alt="Pipa"><b>Cuenta los peces conmigo</b></div><div class="pond"><div id="fishRow" class="fishRow"></div></div><div id="countPrompt" class="prompt"></div><div id="countAnswers" class="answers"></div><div id="countReward" class="reward"></div></section><section id="colors" class="game"><div class="hero"><img src="./pipa-elephant.svg" alt="Pipa"><b>Encuentra el color</b></div><div id="colorPrompt" class="prompt"></div><div id="colorGrid" class="colorGrid"></div><div id="colorReward" class="reward"></div></section><section id="shapes" class="game"><div class="hero"><img src="./pipa-elephant.svg" alt="Pipa"><b>Descubre las formas</b></div><div id="shapePrompt" class="prompt"></div><div id="shapeGrid" class="shapeGrid"></div><div id="shapeReward" class="reward"></div></section></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}function showGame(id){if(!['count','colors','shapes'].includes(id))id='count';document.querySelectorAll('.game').forEach(x=>x.classList.toggle('on',x.id===id));location.hash=id;if(id==='count')newCount();if(id==='colors')newColor();if(id==='shapes')newShape()}function yay(id,msg){document.getElementById(id).textContent='⭐ '+msg;say(msg);setTimeout(()=>document.getElementById(id).textContent='',900)}function newCount(){let n=1+Math.floor(Math.random()*6);fishRow.innerHTML=Array.from({length:n},(_,i)=>`<span class="fish">${i%2?'🐠':'🐟'}</span>`).join('');countPrompt.textContent='¿Cuántos peces hay?';let opts=[n,Math.max(1,n-1),Math.min(6,n+1)].filter((v,i,a)=>a.indexOf(v)===i).sort(()=>Math.random()-.5);countAnswers.innerHTML=opts.map(v=>`<button class="ans" onclick="pickCount(${v},${n})">${v}</button>`).join('')}function pickCount(v,n){if(v===n){yay('countReward','¡Muy bien!');setTimeout(newCount,650)}else say('Cuenta otra vez')}const colors=[['Rojo','#ff5364'],['Azul','#379fea'],['Verde','#57cf69'],['Amarillo','#ffd84d'],['Rosa','#ff83ba'],['Morado','#8b6ee8']];let targetColor=0;function newColor(){targetColor=Math.floor(Math.random()*colors.length);colorPrompt.textContent='Toca '+colors[targetColor][0];colorGrid.innerHTML=colors.map((c,i)=>`<button class="color" style="background:${c[1]}" onclick="pickColor(${i})" aria-label="${c[0]}"></button>`).join('')}function pickColor(i){if(i===targetColor){yay('colorReward','¡Ese es!');setTimeout(newColor,650)}else say('Prueba otro color')}const shapes=[['●','círculo'],['■','cuadrado'],['▲','triángulo'],['♥','corazón'],['★','estrella'],['◆','rombo']];let targetShape=0;function newShape(){targetShape=Math.floor(Math.random()*shapes.length);shapePrompt.textContent='Busca '+shapes[targetShape][1];shapeGrid.innerHTML=shapes.map((s,i)=>`<button class="shape" onclick="pickShape(${i})">${s[0]}</button>`).join('')}function pickShape(i){if(i===targetShape){yay('shapeReward','¡Lo encontraste!');setTimeout(newShape,650)}else say('Mira otra vez')}let initial=location.hash.replace('#','')||sessionStorage.getItem('lagoonGame')||'count';showGame(initial);window.addEventListener('hashchange',()=>showGame(location.hash.replace('#','')))</script></body></html>
