<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.map{position:relative;border-radius:34px;overflow:hidden;box-shadow:0 8px 0 #ded5c5}.map>img{display:block;width:100%}.spot{position:absolute;border:5px solid #fff;border-radius:50%;width:76px;height:76px;font-size:35px;box-shadow:0 6px 0 #0002;animation:pulse 2s infinite}.village{left:12%;top:52%;background:#ff9f70}.forest{left:34%;top:37%;background:#79d67b}.lagoon{right:14%;top:57%;background:#65c8f1}.adventure{left:52%;top:24%;background:#8c72e8}.panel{margin-top:15px;background:#fff;border-radius:28px;padding:16px;display:flex;gap:13px;align-items:center}.panel img{width:76px;height:76px}.panel b{font-size:21px}.play{border:0;background:#6754e8;color:#fff;border-radius:18px;padding:12px 16px;font-weight:1000;margin-top:8px}@keyframes pulse{50%{transform:scale(1.08)}}@media(max-width:520px){.spot{width:62px;height:62px;font-size:28px;border-width:4px}.panel b{font-size:18px}}</style></head><body><div class="wrap"><div class="map"><img src="./map-world.svg" alt="Mapa de Mundo Mimo"><button class="spot village" onclick="pick('Villa Mimo','Cuentos, emociones y vida cotidiana','stories')">🏠</button><button class="spot forest" onclick="pick('Bosque de Lío','Animales, sonidos y parejas','animals')">🦁</button><button class="spot lagoon" onclick="pick('Laguna de Pipa','Números, formas y colores','count')">🐘</button><button class="spot adventure" onclick="pick('Monte Aventura','Letras, lógica y retos','letters')">⭐</button></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¿Dónde quieres ir?</b><div id="desc">Toca un lugar del mapa.</div><button id="go" class="play" hidden>ENTRAR ▶</button></div></div></div><script>let target='';function pick(t,d,x){title.textContent=t;desc.textContent=d;target=x;go.hidden=false;if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t+'. '+d);u.lang='es-ES';u.rate=.8;speechSynthesis.speak(u)}}go.onclick=()=>{parent.postMessage({type:'mimo-world',target},'*')}</script></body></html>
