<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#157bff"><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#4ec8ff,#7657ef 72%,#412c9d);font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;color:#fff;min-height:100vh}.wrap{max-width:940px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.logo{font-size:30px;font-weight:1000;text-shadow:0 4px 0 #17469b,-1px -1px 0 #fff}.logo span{color:#ffd83e}.library{border:4px solid #fff;background:linear-gradient(#ffd94b,#ff9f16);color:#432f7c;border-radius:22px;padding:11px 15px;font-weight:1000;box-shadow:0 6px 0 #b66a00}.map{position:relative;border:6px solid #fff;border-radius:38px;overflow:hidden;box-shadow:0 10px 0 #2c2583,0 18px 35px #14246b55;background:#9ce7ff}.map>img{display:block;width:100%;filter:saturate(1.25) contrast(1.05)}.spot{position:absolute;border:6px solid #fff;border-radius:28px;min-width:84px;height:84px;font-size:38px;box-shadow:0 7px 0 #342681,0 9px 18px #0003;animation:pulse 2s infinite;z-index:5}.village{left:10%;top:51%;background:linear-gradient(#ff755f,#e52e53)}.forest{left:33%;top:36%;background:linear-gradient(#75e46e,#22a953)}.lagoon{right:12%;top:57%;background:linear-gradient(#5fe6ff,#198ee8)}.adventure{left:52%;top:23%;background:linear-gradient(#ffd94b,#ff8d19)}.toy{position:absolute;border:0;background:transparent;font-size:47px;filter:drop-shadow(0 5px 0 #0003);z-index:3}.cloudToy{left:8%;top:12%}.birdToy{right:25%;top:14%}.fishToy{right:19%;top:66%}.treeToy{left:27%;top:47%}.toy.pop{animation:pop .45s ease}.mimo{position:absolute;left:43%;top:70%;width:100px;height:100px;z-index:4;transition:all .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 7px 0 #322570)}.panel{margin-top:15px;background:linear-gradient(135deg,#fff,#edf5ff);color:#26355d;border:5px solid #fff;border-radius:30px;padding:15px;display:flex;gap:13px;align-items:center;box-shadow:0 8px 0 #302587}.avatar{width:82px;height:82px;background:linear-gradient(#ffe86a,#ffad26);border:4px solid #fff;border-radius:24px;padding:3px;box-shadow:0 5px 0 #d17800}.panel b{font-size:23px;color:#4634a8}.play{border:4px solid #fff;background:linear-gradient(#ffd83d,#ff9716);color:#432d77;border-radius:21px;padding:12px 19px;font-weight:1000;margin-top:8px;box-shadow:0 6px 0 #bd6800;font-size:17px}.hint{font-size:13px;color:#6e7897;margin-top:6px}.stars{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;font-size:28px;animation:spark 1s forwards}.worldLabels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.badge{border:3px solid #fff;border-radius:17px;padding:8px 4px;text-align:center;font-size:13px;font-weight:1000;box-shadow:0 4px 0 #302587}.b1{background:#e83d55}.b2{background:#28ad55}.b3{background:#198fe8}.b4{background:#f69b17}@keyframes pulse{50%{transform:scale(1.08) translateY(-3px)}}@keyframes pop{50%{transform:scale(1.4) rotate(10deg)}}@keyframes spark{to{transform:translateY(-90px) scale(.3);opacity:0}}@media(max-width:520px){.logo{font-size:23px}.library{padding:8px 10px;font-size:12px}.spot{min-width:65px;height:65px;font-size:29px;border-width:4px;border-radius:20px}.panel b{font-size:19px}.toy{font-size:36px}.mimo{width:76px;height:76px}.worldLabels{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div class="logo">Mundo <span>Mimo</span> ⭐</div><button class="library" onclick="location.href='../index.html'">🎮 TODOS LOS JUEGOS</button></div><div class="worldLabels"><div class="badge b1">🏠 VILLA MIMO</div><div class="badge b2">🌳 BOSQUE DE LÍO</div><div class="badge b3">💦 LAGUNA DE PIPA</div><div class="badge b4">⭐ MONTE AVENTURA</div></div><div id="map" class="map"><img src="./map-world.svg" alt="Mapa de Mundo Mimo"><div id="stars" class="stars"></div><img id="mimo" class="mimo" src="./mimo-bear.svg" alt="Mimo"><button class="spot village" onclick="pick('Villa Mimo','Cuentos, emociones, dibujo y rutinas','village',18,61)">🏠</button><button class="spot forest" onclick="pick('Bosque de Lío','Animales, sonidos y aventuras','forest',39,45)">🦁</button><button class="spot lagoon" onclick="pick('Laguna de Pipa','Números, colores y formas','lagoon',73,66)">🐘</button><button class="spot adventure" onclick="pick('Monte Aventura','Letras, lógica y retos','adventure',56,30)">⭐</button><button class="toy cloudToy" onclick="toy(this,'La nube pasa despacito')">☁️</button><button class="toy birdToy" onclick="toy(this,'¡Un pájaro vuela sobre Mundo Mimo!')">🐦</button><button class="toy fishToy" onclick="toy(this,'¡Un pez salta en la laguna!')">🐟</button><button class="toy treeToy" onclick="toy(this,'Las hojas se mueven con el viento')">🌳</button></div><div class="panel"><img class="avatar" src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¡Elige una aventura!</b><div id="desc">Toca uno de los mundos y Mimo te acompañará.</div><button id="go" class="play" hidden>▶ ¡VAMOS!</button><div class="hint">También puedes tocar las cosas del mapa para descubrir sorpresas.</div></div></div></div><script>let target='';const allowed=['village','forest','lagoon','adventure'];function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.8;u.pitch=1.08;speechSynthesis.speak(u)}function sparkle(x,y){for(let i=0;i<9;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','💎','💛'][i%4];s.style.left=(x+Math.random()*12-6)+'%';s.style.top=(y+Math.random()*8-4)+'%';stars.appendChild(s);setTimeout(()=>s.remove(),1000)}}function pick(t,d,x,mx,my){title.textContent=t;desc.textContent=d;target=x;go.hidden=false;mimo.style.left=(mx-5)+'%';mimo.style.top=(my-8)+'%';sparkle(mx,my);say(t+'. '+d)}function toy(el,t){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');say(t)}go.onclick=()=>{if(!allowed.includes(target))return;location.href='./'+({village:'village-world.html',forest:'forest-world.html',lagoon:'lagoon-world.html',adventure:'adventure-world.html'}[target])}</script></body></html>
