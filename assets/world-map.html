<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6754e8"><style>*{box-sizing:border-box}body{margin:0;background:#fff8e5;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.brand{font-size:27px;font-weight:1000}.library{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #d8d0c2}.map{position:relative;border-radius:34px;overflow:hidden;box-shadow:0 8px 0 #ded5c5;background:#9ce7ff}.map>img{display:block;width:100%}.spot{position:absolute;border:5px solid #fff;border-radius:50%;width:78px;height:78px;font-size:36px;box-shadow:0 6px 0 #0002;animation:pulse 2s infinite;z-index:5}.village{left:12%;top:52%;background:#ff9f70}.forest{left:34%;top:37%;background:#79d67b}.lagoon{right:14%;top:57%;background:#65c8f1}.adventure{left:52%;top:24%;background:#8c72e8}.toy{position:absolute;border:0;background:transparent;font-size:44px;filter:drop-shadow(0 4px 0 #0002);z-index:3}.cloudToy{left:8%;top:12%}.birdToy{right:25%;top:14%}.fishToy{right:19%;top:66%}.treeToy{left:27%;top:47%}.toy.pop{animation:pop .45s ease}.mimo{position:absolute;left:43%;top:72%;width:86px;height:86px;z-index:4;transition:all .8s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 5px 0 #0002)}.panel{margin-top:15px;background:#fff;border-radius:28px;padding:16px;display:flex;gap:13px;align-items:center;box-shadow:0 5px 0 #eadfce}.panel img{width:76px;height:76px}.panel b{font-size:21px}.play{border:0;background:#6754e8;color:#fff;border-radius:18px;padding:12px 16px;font-weight:1000;margin-top:8px}.hint{font-size:13px;color:#71798e;margin-top:6px}.stars{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;font-size:25px;animation:spark 1s forwards}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes pop{50%{transform:scale(1.35) rotate(10deg)}}@keyframes spark{to{transform:translateY(-80px) scale(.3);opacity:0}}@media(max-width:520px){.brand{font-size:23px}.spot{width:62px;height:62px;font-size:28px;border-width:4px}.panel b{font-size:18px}.toy{font-size:35px}.mimo{width:68px;height:68px}}</style></head><body><div class="wrap"><div class="top"><div class="brand">🌟 Explora Mundo Mimo</div><button class="library" onclick="location.href='../index.html'">🎮 Todos los juegos</button></div><div id="map" class="map"><img src="./map-world.svg" alt="Mapa de Mundo Mimo"><div id="stars" class="stars"></div><img id="mimo" class="mimo" src="./mimo-bear.svg" alt="Mimo"><button class="spot village" onclick="pick('Villa Mimo','Cuentos, emociones, dibujo y vida cotidiana','stories',18,61)">🏠</button><button class="spot forest" onclick="pick('Bosque de Lío','Animales, sonidos reales y parejas','animals',39,45)">🦁</button><button class="spot lagoon" onclick="pick('Laguna de Pipa','Números, formas y colores','count',73,66)">🐘</button><button class="spot adventure" onclick="pick('Monte Aventura','Letras, lógica y retos','letters',56,30)">⭐</button><button class="toy cloudToy" onclick="toy(this,'La nube hace ¡fuuu!')">☁️</button><button class="toy birdToy" onclick="toy(this,'¡Un pájaro! Pío, pío')">🐦</button><button class="toy fishToy" onclick="toy(this,'¡Un pez salta en la laguna!')">🐟</button><button class="toy treeToy" onclick="toy(this,'Las hojas se mueven con el viento')">🌳</button></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¿Dónde quieres ir?</b><div id="desc">Toca un lugar o descubre cosas del mapa.</div><button id="go" class="play" hidden>ENTRAR ▶</button><div class="hint">Las cosas del mapa también se pueden tocar. No todo es un ejercicio.</div></div></div></div><script>let target='';const allowed=['stories','animals','count','letters'];function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.8;u.pitch=1.08;speechSynthesis.speak(u)}function sparkle(x,y){for(let i=0;i<7;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','💛'][i%3];s.style.left=(x+Math.random()*12-6)+'%';s.style.top=(y+Math.random()*8-4)+'%';stars.appendChild(s);setTimeout(()=>s.remove(),1000)}}function pick(t,d,x,mx,my){title.textContent=t;desc.textContent=d;target=x;go.hidden=false;mimo.style.left=(mx-5)+'%';mimo.style.top=(my-8)+'%';sparkle(mx,my);say(t+'. '+d)}function toy(el,t){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');say(t)}go.onclick=()=>{if(!allowed.includes(target))return;try{if(parent!==window){parent.postMessage({type:'mimo-world',target},'*')}else{location.href='../index.html'}}catch(e){location.href='../index.html'}}</script></body></html>
