<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#55c9ef"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#e8fbff;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #c8e5ea}.scene{height:480px;position:relative;overflow:hidden;border-radius:34px;background:linear-gradient(#91e7ff 0 34%,#66d7ee 34% 48%,#39b9dc 48% 100%);box-shadow:0 8px 0 #b9dfe7}.sun{position:absolute;right:8%;top:5%;font-size:62px}.pipa{position:absolute;width:205px;left:7%;bottom:5%;z-index:4;filter:drop-shadow(0 9px 0 #0002);animation:bob 2.2s infinite}.lily{position:absolute;font-size:74px;bottom:18%;right:10%}.fish{position:absolute;border:0;background:transparent;font-size:58px;filter:drop-shadow(0 5px 0 #0002);animation:swim 3s ease-in-out infinite}.f1{left:45%;top:58%}.f2{right:11%;top:67%;animation-delay:.7s}.frog{position:absolute;border:0;background:transparent;font-size:65px;right:22%;top:39%}.bubble{position:absolute;border:0;background:#ffffff55;border-radius:50%;font-size:28px;width:55px;height:55px}.b1{left:50%;top:48%}.b2{left:61%;top:70%}.b3{right:8%;top:51%}.shape{position:absolute;border:5px solid #fff;box-shadow:0 5px 0 #0002}.circle{width:70px;height:70px;border-radius:50%;background:#ffdb4d;left:42%;top:23%}.square{width:68px;height:68px;border-radius:15px;background:#ff82aa;left:57%;top:18%}.triangle{width:0;height:0;border-left:38px solid transparent;border-right:38px solid transparent;border-bottom:70px solid #846ee7;border-top:0;box-shadow:none;right:15%;top:23%}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:0;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:16px;box-shadow:0 5px 0 #0001}.a1{background:#ffe272}.a2{background:#ffacd0}.a3{background:#a9e6ff}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes swim{50%{transform:translateX(25px) rotate(-5deg)}}@media(max-width:520px){.scene{height:425px}.pipa{width:165px}.fish{font-size:48px}.actions{grid-template-columns:1fr}.action{padding:13px}}</style></head><body><div class="wrap"><div class="top"><h2>💦 Laguna de Pipa</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><span class="sun">☀️</span><img class="pipa" src="./pipa-elephant.svg" alt="Pipa" onclick="say('Hola, soy Pipa. En mi laguna jugamos con números, colores y formas')"><button class="fish f1" onclick="discover('Un pez azul. Uno')">🐟</button><button class="fish f2" onclick="discover('Otro pez. Ahora puedes contar dos peces')">🐠</button><button class="frog" onclick="discover('Una rana verde salta cerca del agua')">🐸</button><button class="bubble b1" onclick="pop(this)">🫧</button><button class="bubble b2" onclick="pop(this)">🫧</button><button class="bubble b3" onclick="pop(this)">🫧</button><button class="shape circle" aria-label="círculo" onclick="discover('Círculo amarillo')"></button><button class="shape square" aria-label="cuadrado" onclick="discover('Cuadrado rosa')"></button><button class="triangle" aria-label="triángulo" onclick="discover('Triángulo morado')"></button><span class="lily">🪷</span></div><div class="panel"><img src="./pipa-elephant.svg" alt="Pipa"><div><b id="title">¡Juega con la laguna!</b><div id="desc">Toca peces, burbujas y formas. Aquí también se aprende explorando.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('count')">🔢 Contar</button><button class="action a2" onclick="openGame('colors')">🌈 Colores</button><button class="action a3" onclick="openGame('shapes')">🔷 Formas</button></div></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.1;speechSynthesis.speak(u)}function discover(t){title.textContent=t;desc.textContent='¡Muy bien! Sigue tocando cosas de la laguna.';say(t)}function pop(e){e.style.visibility='hidden';say('¡Pop!');setTimeout(()=>e.style.visibility='visible',1200)}function openGame(target){sessionStorage.setItem('mimoTarget',target);location.href='../index.html?game='+encodeURIComponent(target)}</script></body></html>
