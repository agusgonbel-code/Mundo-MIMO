<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#279ee8"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#62dfff,#4e58d9);color:#24345d;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff;text-shadow:0 3px 0 #1a4c8d}.back{border:4px solid #fff;background:linear-gradient(#ffe34e,#ff9d17);border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px 0 #9c6500}.scene{height:480px;position:relative;overflow:hidden;border:6px solid #fff;border-radius:36px;background:linear-gradient(#91e7ff 0 34%,#65d8ee 34% 48%,#31afd8 48% 100%);box-shadow:0 9px 0 #2e2a83}.sun{position:absolute;right:6%;top:4%;font-size:54px}.pipa{position:absolute;width:190px;left:5%;bottom:3%;z-index:4;filter:drop-shadow(0 9px 0 #0002);animation:bob 2.2s infinite}.frog{position:absolute;width:106px;height:106px;right:8%;top:34%;border:5px solid #fff;border-radius:28px;background:linear-gradient(#fff,#eaffef);box-shadow:0 7px 0 #2e2a83;padding:3px;animation:pulse 2.5s infinite}.frog img{width:100%;height:100%;object-fit:contain}.fish{position:absolute;border:5px solid #fff;background:linear-gradient(#fff,#eaf7ff);border-radius:26px;width:94px;height:94px;font-size:50px;box-shadow:0 7px 0 #2e2a83;animation:swim 3s ease-in-out infinite}.f1{left:45%;top:58%}.f2{right:10%;top:70%;animation-delay:.7s}.bubble{position:absolute;border:4px solid #fff;background:#ffffff44;border-radius:50%;font-size:24px;width:52px;height:52px;box-shadow:0 4px 0 #2e2a83}.b1{left:52%;top:48%}.b2{left:63%;top:72%}.b3{right:8%;top:53%}.shape{position:absolute;border:5px solid #fff;box-shadow:0 6px 0 #2e2a83}.circle{width:68px;height:68px;border-radius:50%;background:#ffdb4d;left:39%;top:19%}.square{width:68px;height:68px;border-radius:18px;background:#ff82aa;left:55%;top:16%}.triangle{width:0;height:0;border-left:36px solid transparent;border-right:36px solid transparent;border-bottom:66px solid #846ee7;border-top:0;right:17%;top:19%;filter:drop-shadow(0 6px 0 #2e2a83)}.panel{margin-top:14px;background:#fff;border:5px solid #fff;border-radius:28px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 7px 0 #2e2a83}.panel img{width:76px}.panel b{font-size:22px;color:#4938aa}.note{font-size:13px;color:#72798f}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:4px solid #fff;border-radius:22px;padding:15px 8px;font-weight:1000;font-size:16px;box-shadow:0 6px 0 #2e2a83}.a1{background:#ffe272}.a2{background:#ffacd0}.a3{background:#a9e6ff}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes swim{50%{transform:translateX(14px) rotate(-4deg)}}@keyframes pulse{50%{transform:scale(1.05) translateY(-2px)}}@media(max-width:520px){.scene{height:390px}.pipa{width:138px;left:3%}.frog{width:78px;height:78px;right:5%;top:36%}.fish{width:72px;height:72px;font-size:38px}.f1{left:43%;top:61%}.f2{right:7%;top:72%}.circle{left:35%;top:18%}.square{left:54%;top:13%}.triangle{right:12%;top:17%}.bubble{width:44px;height:44px;font-size:19px}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>💦 LAGUNA DE PIPA</h2><button class="back" onclick="location.href='./world-map.html'">← MAPA</button></div><div class="scene"><span class="sun">☀️</span><img class="pipa" src="./pipa-elephant.svg" alt="Pipa"><button class="fish f1" onclick="discover('Un pez azul. Uno')">🐟</button><button class="fish f2" onclick="discover('Otro pez. Ya puedes contar dos')">🐠</button><button class="frog" onclick="discover('La rana de Mundo Mimo vive cerca del agua')"><img src="./frog-mimo.svg" alt="Rana Mimo"></button><button class="bubble b1" onclick="pop(this)">🫧</button><button class="bubble b2" onclick="pop(this)">🫧</button><button class="bubble b3" onclick="pop(this)">🫧</button><button class="shape circle" aria-label="círculo" onclick="discover('Círculo amarillo')"></button><button class="shape square" aria-label="cuadrado" onclick="discover('Cuadrado rosa')"></button><button class="triangle" aria-label="triángulo" onclick="discover('Triángulo morado')"></button></div><div class="panel"><img src="./pipa-elephant.svg" alt="Pipa"><div><b id="title">¡Explora y juega con Pipa!</b><div id="desc">Toca peces, burbujas y formas. Después entra en un juego.</div><div class="note">Sin narración sintética automática.</div></div></div><div class="actions"><button class="action a1" onclick="openLagoon('count')">🔢 CONTAR</button><button class="action a2" onclick="openLagoon('colors')">🌈 COLORES</button><button class="action a3" onclick="openLagoon('shapes')">🔷 FORMAS</button></div></div><script>function discover(t){title.textContent=t;desc.textContent='Sigue explorando la laguna o entra en un juego.'}function pop(e){e.style.visibility='hidden';setTimeout(()=>e.style.visibility='visible',850)}function openLagoon(game){location.href='./lagoon-games.html#'+game}</script></body></html>
