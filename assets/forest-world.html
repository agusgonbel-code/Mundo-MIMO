<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bosque de Lío</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#62dfff,#31bd69);color:#fff}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}.back{border:4px solid #fff;border-radius:18px;background:#ffe052;padding:9px 13px;font-weight:1000;color:#4d347d;box-shadow:0 5px 0 #9b6700}.scene{margin-top:10px;border:6px solid #fff;border-radius:34px;background:linear-gradient(#a9efff,#83e886);box-shadow:0 9px 0 #187a4b;padding:16px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center}.heroText{color:#27405f}.heroText h1{font-size:31px;margin:0 0 7px;color:#3e3299}.heroText p{font-weight:900;margin:0}.hero img{width:100%;max-height:240px;object-fit:contain;filter:drop-shadow(0 9px 0 #0002)}.friends{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.friend{border:5px solid #fff;border-radius:25px;background:linear-gradient(#fff,#eaf7ff);box-shadow:0 6px 0 #322982;padding:5px}.friend img{width:100%;height:125px;object-fit:contain}.friend b{display:block;color:#3d3d71;font-size:14px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.action{border:5px solid #fff;border-radius:22px;padding:14px 7px;font-weight:1000;box-shadow:0 6px 0 #322982;color:#373165}.a1{background:#ffe253}.a2{background:#83e9a0}.a3{background:#79d6ff}@media(max-width:560px){.hero{grid-template-columns:1fr}.hero img{max-height:180px}.friends{grid-template-columns:1fr 1fr}.friend img{height:110px}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 BOSQUE DE LÍO</h2><button class="back" onclick="location.href='../app-v28.html'">← INICIO</button></div><section class="scene"><div class="hero"
