<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35b75b"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#5bd7ff,#3ecf76);color:#283250;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;text-shadow:0 3px 0 #176b49}.back{border:4px solid #fff;background:linear-gradient(#ffe354,#ff9f19);border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px 0 #9b6500}.scene{position:relative;height:490px;border:6px solid #fff;border-radius:36px;overflow:hidden;background:linear-gradient(#83e5ff 0 47%,#70da72 47% 100%);box-shadow:0 9px 0 #167a48}.sun{position:absolute;right:7%;top:5%;font-size:66px}.cloud{position:absolute;left:7%;top:8%;font-size:60px;border:0;background:transparent}.tree{position:absolute;font-size:120px;bottom:9%;filter:drop-shadow(0 6px 0 #0002)}.t1{left:-2%}.t2{right:-2%}.lion{position:absolute;width:215px;left:36%;bottom:3%;z-index:4;filter:drop-shadow(0 10px 0 #28623355);animation:bob 2.2s infinite}.animal{position:absolute;border:5px solid #fff;background:linear-gradient(#fff,#eaf5ff);border-radius:28px;width:126px;height:126px;padding:3px;box-shadow:0 7px 0 #2d2982;animation:pulse 2.4s infinite;overflow:hidden}.animal img{width:100%;height:100%;object-fit:contain}.dog{left:11%;bottom:8%}.cat{right:11%;bottom:11%}.cow{left:13%;top:30%;font-size:65px}.frog{right:15%;top:28%;font-size:65px}.panel{margin-top:14px;background:#fff;border:5px solid #fff;border-radius:27px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 7px 0 #257a4d}.panel img{width:78px}.panel b{font-size:22px;color:#4d35b1}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:4px solid #fff;border-radius:22px;padding:15px 8px;font-weight:1000;font-size:16px;box-shadow:0 6px 0 #2e287d}.a1{background:#ffe04e}.a2{background:#65e28b}.a3{background:#61caff}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes pulse{50%{transform:scale(1.07) translateY(-3px)}}@media(max-width:520px){.scene{height:440px}.lion{width:170px;left:29%}.animal{width:96px;height:96px}.cow,.frog{font-size:50px}.tree{font-size:92px}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 BOSQUE DE LÍO</h2><button class="back" onclick="location.href='./world-map.html'">← MAPA</button></div><div class="scene"><span class="sun">☀️</span><button class="cloud" onclick="say('Una nube suave pasa sobre el bosque')">☁️</button><span class="tree t1">🌳</span><span class="tree t2">🌲</span><img class="lion" src="./lio-lion.svg" alt="Lío el león" onclick="say('Hola, soy Lío. ¿Quieres conocer a mis amigos?')"><button class="animal dog" onclick="animal('Perro','guau')"><img src="./dog-mimo.svg" alt="Perro"></button><button class="animal cat" onclick="animal('Gato','miau')"><img src="./cat-mimo.svg" alt="Gato"></button><button class="animal cow" onclick="animal('Vaca','muuu')">🐮</button><button class="animal frog" onclick="animal('Rana','croac')">🐸</button></div><div class="panel"><img src="./lio-lion.svg" alt="Lío"><div><b id="title">¡Conoce a la pandilla del bosque!</b><div id="desc">Toca cada personaje. Estamos sustituyendo los emojis por animales propios de Mundo Mimo.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('animals')">🔊 SAFARI</button><button class="action a2" onclick="openGame('pairs')">🧠 PAREJAS</button><button class="action a3" onclick="openGame('sounds')">🎵 SONIDOS</button></div></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.1;speechSynthesis.speak(u)}function animal(n,s){title.textContent=n;desc.textContent='Este es '+n+'. En Safari podrás aprender su sonido.';say(n+'. '+s)}function openGame(target){sessionStorage.setItem('mimoTarget',target);location.href='../index.html?game='+encodeURIComponent(target)}</script></body></html>
