<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#35b75b"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#5bd7ff,#3ecf76);color:#283250;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;text-shadow:0 3px 0 #176b49}.back{border:4px solid #fff;background:linear-gradient(#ffe354,#ff9f19);border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px 0 #9b6500}.scene{position:relative;height:470px;border:6px solid #fff;border-radius:36px;overflow:hidden;background:linear-gradient(#83e5ff 0 47%,#70da72 47% 100%);box-shadow:0 9px 0 #167a48}.sun{position:absolute;right:6%;top:4%;font-size:55px}.tree{position:absolute;font-size:105px;bottom:7%;filter:drop-shadow(0 6px 0 #0002)}.t1{left:-2%}.t2{right:-2%}.lion{position:absolute;width:195px;left:38%;bottom:1%;z-index:4;filter:drop-shadow(0 10px 0 #28623355);animation:bob 2.2s infinite}.animal{position:absolute;border:5px solid #fff;background:linear-gradient(#fff,#eaf5ff);border-radius:28px;width:112px;height:112px;padding:3px;box-shadow:0 7px 0 #2d2982;animation:pulse 2.4s infinite;overflow:hidden}.animal img{width:100%;height:100%;object-fit:contain}.dog{left:7%;bottom:7%}.cat{right:7%;bottom:9%}.cow{left:12%;top:28%}.frog{right:12%;top:27%}.panel{margin-top:14px;background:#fff;border:5px solid #fff;border-radius:27px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 7px 0 #257a4d}.panel img{width:74px}.panel b{font-size:22px;color:#4d35b1}.note{font-size:13px;color:#71788e}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:4px solid #fff;border-radius:22px;padding:15px 8px;font-weight:1000;font-size:16px;box-shadow:0 6px 0 #2e287d}.a1{background:#ffe04e}.a2{background:#65e28b}.a3{background:#61caff}@keyframes bob{50%{transform:translateY(-8px)}}@keyframes pulse{50%{transform:scale(1.05) translateY(-2px)}}@media(max-width:520px){.scene{height:390px}.lion{width:145px;left:31%}.animal{width:82px;height:82px}.tree{font-size:80px}.dog{left:5%;bottom:6%}.cat{right:5%;bottom:7%}.cow{left:8%;top:30%}.frog{right:8%;top:30%}.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 BOSQUE DE LÍO</h2><button class="back" onclick="location.href='./world-map.html'">← MAPA</button></div><div class="scene"><span class="sun">☀️</span><span class="tree t1">🌳</span><span class="tree t2">🌲</span><img class="lion" src="./lio-lion.svg" alt="Lío el león"><button class="animal dog" onclick="animal('Perro')"><img src="./dog-mimo.svg" alt="Perro"></button><button class="animal cat" onclick="animal('Gato')"><img src="./cat-mimo.svg" alt="Gato"></button><button class="animal cow" onclick="animal('Vaca')"><img src="./cow-mimo.svg" alt="Vaca"></button><button class="animal frog" onclick="animal('Rana')"><img src="./frog-mimo.svg" alt="Rana"></button></div><div class="panel"><img src="./lio-lion.svg" alt="Lío"><div><b id="title">¡La pandilla de Lío!</b><div id="desc">Toca un personaje o entra en uno de los juegos del bosque.</div><div class="note">Los sonidos del Safari son grabaciones reales cuando están disponibles.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('safari')">🔊 SAFARI</button><button class="action a2" onclick="openGame('pairs')">🧠 PAREJAS</button><button class="action a3" onclick="openGame('sounds')">🎵 ¿QUIÉN SUENA?</button></div></div><script>function animal(n){title.textContent=n;desc.textContent='Selecciona Safari para escuchar su sonido real cuando esté disponible.'}function openGame(target){location.href='./forest-games.html#'+target}</script></body></html>
