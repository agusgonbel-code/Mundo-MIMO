<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#67c975"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#eaffd8;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #cdd9bd}.scene{position:relative;height:470px;border-radius:34px;overflow:hidden;background:linear-gradient(#8de4ff 0 47%,#8bdd7d 47% 100%);box-shadow:0 8px 0 #cadbb9}.sun{position:absolute;right:8%;top:7%;font-size:64px}.cloud{position:absolute;left:8%;top:10%;font-size:58px}.tree{position:absolute;font-size:115px;bottom:12%;filter:drop-shadow(0 6px 0 #0001)}.t1{left:2%}.t2{right:2%}.lion{position:absolute;width:210px;height:210px;left:37%;bottom:7%;filter:drop-shadow(0 10px 0 #0002);animation:bob 2.2s infinite}.animal{position:absolute;border:5px solid #fff;background:#fff;border-radius:50%;width:94px;height:94px;font-size:54px;box-shadow:0 6px 0 #0002;animation:pulse 2.4s infinite}.dog{left:14%;bottom:12%}.cat{right:15%;bottom:17%}.cow{left:19%;top:35%}.frog{right:22%;top:30%}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:13px}.action{border:0;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:16px;box-shadow:0 5px 0 #0001}.a1{background:#ffe272}.a2{background:#9ee7b5}.a3{background:#b8dfff}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes pulse{50%{transform:scale(1.08)}}@media(max-width:520px){.scene{height:420px}.lion{width:170px;height:170px;left:31%}.animal{width:78px;height:78px;font-size:44px}.tree{font-size:90px}.actions{grid-template-columns:1fr}.action{padding:13px}}</style></head><body><div class="wrap"><div class="top"><h2>🌳 Bosque de Lío</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><span class="sun">☀️</span><button class="cloud" style="border:0;background:transparent" onclick="say('Una nube suave pasa sobre el bosque')">☁️</button><span class="tree t1">🌳</span><span class="tree t2">🌲</span><img class="lion" src="./lio-lion.svg" alt="Lío el león" onclick="say('Hola, soy Lío. ¿Quieres conocer a mis amigos?')"><button class="animal dog" onclick="animal('Perro','guau')">🐶</button><button class="animal cat" onclick="animal('Gato','miau')">🐱</button><button class="animal cow" onclick="animal('Vaca','muuu')">🐮</button><button class="animal frog" onclick="animal('Rana','croac')">🐸</button></div><div class="panel"><img src="./lio-lion.svg" alt="Lío"><div><b id="title">¡Bienvenido al bosque!</b><div id="desc">Toca los animales y descubre quién vive aquí.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('animals')">🔊 Safari de sonidos</button><button class="action a2" onclick="openGame('pairs')">🧠 Parejas animales</button><button class="action a3" onclick="openGame('sounds')">🎵 Sonidos del mundo</button></div></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.1;speechSynthesis.speak(u)}function animal(n,s){title.textContent=n;desc.textContent='Toca Safari de sonidos para escuchar su grabación real cuando esté disponible.';say(n)}function openGame(target){sessionStorage.setItem('mimoTarget',target);location.href='../index.html?game='+encodeURIComponent(target)}</script></body></html>
