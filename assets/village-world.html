<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff9f70"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#fff3dc;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #decfbd}.scene{position:relative;height:480px;border-radius:34px;overflow:hidden;background:linear-gradient(#a4e9ff 0 45%,#8cdb7f 45%);box-shadow:0 8px 0 #dccfb8}.sun{position:absolute;right:8%;top:5%;font-size:62px}.house{position:absolute;left:31%;bottom:9%;font-size:220px;filter:drop-shadow(0 9px 0 #0002)}.mimo{position:absolute;width:155px;left:7%;bottom:3%;z-index:4;filter:drop-shadow(0 8px 0 #0002);animation:bob 2.2s infinite}.toy{position:absolute;border:0;background:transparent;font-size:58px;filter:drop-shadow(0 4px 0 #0002)}.book{right:9%;bottom:10%}.heart{right:15%;top:18%}.brush{left:14%;top:20%}.tooth{right:37%;top:12%}.shirt{left:45%;top:16%}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.action{border:0;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:15px;box-shadow:0 5px 0 #0001}.a1{background:#ffd58a}.a2{background:#ffb7d2}.a3{background:#b8e7ff}.a4{background:#bceab5}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.scene{height:425px}.house{font-size:175px;left:25%}.mimo{width:125px}.toy{font-size:48px}.actions{grid-template-columns:1fr 1fr}.action{padding:13px}}</style></head><body><div class="wrap"><div class="top"><h2>🏠 Villa Mimo</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><span class="sun">☀️</span><span class="house">🏡</span><img class="mimo" src="./mimo-bear.svg" alt="Mimo" onclick="discover('¡Hola! En mi casa aprendemos cosas que usamos todos los días.')"><button class="toy book" onclick="discover('Un libro. Podemos escuchar un cuento juntos.')">📚</button><button class="toy heart" onclick="discover('Un corazón. ¿Cómo te sientes hoy?')">💗</button><button class="toy brush" onclick="discover('Un cepillo. Cepillarse los dientes forma parte de nuestra rutina.')">🪥</button><button class="toy tooth" onclick="discover('¡Dientes limpios y cuidados!')">🦷</button><button class="toy shirt" onclick="discover('Una camiseta. Vestirse es algo que podemos aprender paso a paso.')">👕</button></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¡Bienvenido a casa!</b><div id="desc">Toca las cosas de Villa Mimo y descubre para qué sirven.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('stories')">📚 Cuentos</button><button class="action a2" onclick="openGame('emotions')">😊 Emociones</button><button class="action a3" onclick="openGame('draw')">🎨 Dibujar</button><button class="action a4" onclick="openGame('classify')">🧺 Ordenar</button></div></div><script>function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.78;u.pitch=1.08;speechSynthesis.speak(u)}function discover(t){title.textContent=t;desc.textContent='Sigue explorando la casa de Mimo.';say(t)}function openGame(target){sessionStorage.setItem('mimoTarget',target);location.href='../index.html?game='+encodeURIComponent(target)}</script></body></html>
