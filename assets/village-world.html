<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff9f70"><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:#fff3dc;color:#283250}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between}.back{border:0;background:#fff;border-radius:18px;padding:11px 14px;font-weight:1000;box-shadow:0 4px 0 #decfbd}.scene{position:relative;height:480px;border-radius:34px;overflow:hidden;background:linear-gradient(#a4e9ff 0 45%,#8cdb7f 45%);box-shadow:0 8px 0 #dccfb8}.sun{position:absolute;right:8%;top:5%;font-size:62px}.house{position:absolute;left:34%;bottom:7%;font-size:190px;filter:drop-shadow(0 9px 0 #0002)}.mimo{position:absolute;width:145px;left:7%;bottom:3%;z-index:4;filter:drop-shadow(0 8px 0 #0002);animation:bob 2.2s infinite}.toy{position:absolute;border:4px solid #fff;background:#ffffffcc;border-radius:22px;width:76px;height:76px;font-size:42px;display:grid;place-items:center;box-shadow:0 5px 0 #7c65b0}.book{right:8%;bottom:10%}.heart{right:12%;top:17%}.brush{left:12%;top:20%}.shirt{left:47%;top:12%}.panel{margin-top:14px;background:#fff;border-radius:27px;padding:15px;display:flex;gap:12px;align-items:center}.panel img{width:72px}.panel b{font-size:22px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.action{border:4px solid #fff;border-radius:22px;padding:16px 8px;font-weight:1000;font-size:15px;box-shadow:0 5px 0 #75609e}.a1{background:#ffd58a}.a2{background:#ffb7d2}.a3{background:#b8e7ff}.a4{background:#bceab5}.note{font-size:13px;color:#6d7287}@keyframes bob{50%{transform:translateY(-8px)}}@media(max-width:520px){.scene{height:400px}.house{font-size:145px;left:30%;bottom:12%}.mimo{width:110px}.toy{width:62px;height:62px;font-size:34px}.book{right:5%;bottom:8%}.heart{right:6%;top:18%}.brush{left:6%;top:18%}.shirt{left:47%;top:10%}.actions{grid-template-columns:1fr 1fr}.action{padding:13px}}</style></head><body><div class="wrap"><div class="top"><h2>🏠 Villa Mimo</h2><button class="back" onclick="location.href='./world-map.html'">← Mapa</button></div><div class="scene"><span class="sun">☀️</span><span class="house">🏡</span><img class="mimo" src="./mimo-bear.svg" alt="Mimo"><button class="toy book" onclick="discover('Un libro para inventar historias')">📚</button><button class="toy heart" onclick="discover('Aquí aprendemos a reconocer emociones')">💗</button><button class="toy brush" onclick="discover('Las rutinas también se aprenden jugando')">🪥</button><button class="toy shirt" onclick="discover('Vestirse paso a paso es una gran aventura')">👕</button></div><div class="panel"><img src="./mimo-bear.svg" alt="Mimo"><div><b id="title">¡Bienvenido a casa!</b><div id="desc">Toca las cosas de Villa Mimo y elige un juego.</div><div class="note">Sin voz sintética automática.</div></div></div><div class="actions"><button class="action a1" onclick="openGame('stories')">📚 Cuentos</button><button class="action a2" onclick="openGame('emotions')">😊 Emociones</button><button class="action a3" onclick="openGame('draw')">🎨 Dibujar</button><button class="action a4" onclick="openGame('sort')">🧺 Ordenar</button></div></div><script>function discover(t){title.textContent=t;desc.textContent='Sigue explorando o entra en uno de los juegos.'}function openGame(target){location.href='./village-games.html#'+target}</script></body></html>
