<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f25b76"><title>Villa Mimo · Juegos</title><style>*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,'Arial Rounded MT Bold',-apple-system,sans-serif;background:linear-gradient(#ffb2c5,#7657ef);color:#31385f;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;color:#fff}.back{border:4px solid #fff;background:#ffe052;border-radius:20px;padding:10px 14px;font-weight:1000;box-shadow:0 5px #a46800}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.tab{border:4px solid #fff;border-radius:20px;padding:11px 5px;font-weight:1000;box-shadow:0 5px #35297d;background:#fff}.tab:nth-child(1){background:#ffd69a}.tab:nth-child(2){background:#ffb5d1}.tab:nth-child(3){background:#b9e8ff}.tab:nth-child(4){background:#c9efbf}.game{display:none;background:#fff7fb;border:5px solid #fff;border-radius:32px;padding:15px;box-shadow:0 8px #35297d;min-height:520px}.game.on{display:block}.hero{display:flex;align-items:center;gap:12px;justify-content:center}.hero img{width:105px}.hero b{font-size:23px;color:#5039b0}.storyCard,.emotionCard,.drawCard,.sortCard{margin:14px auto;max-width:620px;background:#fff;border-radius:28px;padding:18px;box-shadow:0 6px #e1d9ec}.storyVisual{height:220px;border-radius:24px;background:linear-gradient(#bfeeff,#94dd88);display:flex;align-items:center;justify-content:center;font-size:100px}.storyText{font-size:20px;line-height:1.45;font-weight:800}.navrow{display:flex;gap:10px;justify-content:center}.btn{border:4px solid #fff;border-radius:19px;padding:11px 16px;font-weight:1000;box-shadow:0 5px #35297d;background:#715de7;color:#fff}.face{font-size:150px;text-align:center}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{border:4px solid #fff;background:#f0ebff;border-radius:21px;padding:14px;font-size:20px;font-weight:1000;box-shadow:0 5px #c8bfdf}.canvas{width:100%;height:330px;background:#fff;border:5px solid #e6e0ee;border-radius:25px;touch-action:none}.palette{display:flex;gap:8px;justify-content:center;margin-bottom:10px}.sw{width:45px;height:45px;border:5px solid #fff;border-radius:50%;box-shadow:0 3px #bbb}.item{text-align:center;font-size:110px}.bins{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bin{border:4px solid #fff;border-radius:22px;padding:16px 7px;font-weight:1000;box-shadow:0 5px #c8bfdf;background:#eef3ff}.feedback{text-align:center;min-height:34px;font-size:22px;font-weight:1000;color:#4d3bae}@media(max-width:560px){.tabs{grid-template-columns:1fr 1fr}.game{min-height:470px}.hero img{width:82px}.storyVisual{height:180px}.face{font-size:125px}.canvas{height:290px}}</style></head><body><div class="wrap"><div class="top"><h2>🏠 JUEGOS DE VILLA MIMO</h2><button class="back" onclick="location.href='./village-world.html'">← VILLA</button></div><div class="tabs"><button class="tab" onclick="show('stories')">📚 CUENTOS</button><button class="tab" onclick="show('emotions')">😊 EMOCIONES</button><button class="tab" onclick="show('draw')">🎨 DIBUJO</button><button class="tab" onclick="show('sort')">🧺 ORDENAR</button></div><section id="stories" class="game on"><div class="hero"><img src="./mimo-bear.svg"><b>Un cuento con Mimo</b></div><div class="storyCard"><div id="storyVisual" class="storyVisual"></div><p id="storyText" class="storyText"></p><div class="navrow"><button class="btn" onclick="prevStory()">◀</button><button class="btn" onclick="nextStory()">▶</button></div></div></section><section id="emotions" class="game"><div class="hero"><img src="./mimo-bear.svg"><b>¿Cómo se siente?</b></div><div class="emotionCard"><div id="face" class="face"></div><div id="emotionAnswers" class="answers"></div><div id="emotionFeedback" class="feedback"></div></div></section><section id="draw" class="game"><div class="hero"><img src="./mimo-bear.svg"><b>Dibuja sin límites</b></div><div class="drawCard"><div class="palette"><button class="sw" style="background:#ff5364" onclick="ink='#ff5364'"></button><button class="sw" style="background:#379fea" onclick="ink='#379fea'"></button><button class="sw" style="background:#57cf69" onclick="ink='#57cf69'"></button><button class="sw" style="background:#ffd84d" onclick="ink='#ffd84d'"></button><button class="sw" style="background:#8b6ee8" onclick="ink='#8b6ee8'"></button></div><canvas id="canvas" class="canvas"></canvas><div class="navrow" style="margin-top:10px"><button class="btn" onclick="clearCanvas()">✨ NUEVO</button></div></div></section><section id="sort" class="game"><div class="hero"><img src="./mimo-bear.svg"><b>Ayuda a ordenar</b></div><div class="sortCard"><div id="sortItem" class="item"></div><div class="bins"><button class="bin" onclick="pickBin('comida')">🍎 COMIDA</button><button class="bin" onclick="pickBin('animal')">🐾 ANIMAL</button><button class="bin" onclick="pickBin('ropa')">👕 ROPA</button></div><div id="sortFeedback" class="feedback"></div></div></section></div><script>function chime(ok=true){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok?660:220;g.gain.setValueAtTime(.09,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.22);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.23)}function show(id){if(!['stories','emotions','draw','sort'].includes(id))id='stories';document.querySelectorAll('.game').forEach(x=>x.classList.toggle('on',x.id===id));if(location.hash.replace('#','')!==id)history.replaceState(null,'','#'+id);if(id==='draw')setTimeout(setupCanvas,40);if(id==='emotions')newEmotion();if(id==='sort')newSort()}const stories=[['🐻⭐🌳','Mimo encontró una estrella junto al bosque. Decidió buscar a sus amigos para ayudarla a volver al cielo.'],['🐻🦁🤝','Lío llegó corriendo. Juntos pensaron una idea y aprendieron que pedir ayuda también es ser valiente.'],['🐘💧🌱','Pipa trajo agua y cuidaron una planta pequeña mientras esperaban la noche.'],['🌳⭐🌙','Cuando llegó la luna, la estrella volvió a brillar arriba. Los tres celebraron su aventura.']];let si=0;function renderStory(){storyVisual.textContent=stories[si][0];storyText.textContent=stories[si][1]}function nextStory(){si=(si+1)%stories.length;renderStory();chime(true)}function prevStory(){si=(si-1+stories.length)%stories.length;renderStory()}const emotions=[['😊','contento'],['😢','triste'],['😠','enfadado'],['😮','sorprendido'],['😴','cansado'],['😨','asustado']];let emo;function newEmotion(){emo=emotions[Math.floor(Math.random()*emotions.length)];face.textContent=emo[0];let opts=[emo[1],...emotions.filter(x=>x[1]!==emo[1]).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);emotionAnswers.innerHTML=opts.map(x=>`<button class="answer" onclick="pickEmotion('${x}')">${x}</button>`).join('');emotionFeedback.textContent=''}function pickEmotion(x){if(x===emo[1]){emotionFeedback.textContent='⭐ ¡Eso es!';chime(true);setTimeout(newEmotion,650)}else{emotionFeedback.textContent='Mira su cara otra vez';chime(false)}}let ink='#8b6ee8',drawing=false,ctx,ready=false;function setupCanvas(){if(ready)return;const c=canvas,r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx=c.getContext('2d');ctx.scale(d,d);ctx.lineCap='round';ctx.lineWidth=12;c.onpointerdown=e=>{drawing=true;const q=c.getBoundingClientRect();ctx.beginPath();ctx.moveTo(e.clientX-q.left,e.clientY-q.top)};c.onpointermove=e=>{if(!drawing)return;const q=c.getBoundingClientRect();ctx.strokeStyle=ink;ctx.lineTo(e.clientX-q.left,e.clientY-q.top);ctx.stroke()};c.onpointerup=c.onpointerleave=()=>drawing=false;ready=true}function clearCanvas(){if(ctx)ctx.clearRect(0,0,canvas.width,canvas.height)}const items=[['🍎','comida'],['🍌','comida'],['🐶','animal'],['🐸','animal'],['👕','ropa'],['🧦','ropa']];let sort;function newSort(){sort=items[Math.floor(Math.random()*items.length)];sortItem.textContent=sort[0];sortFeedback.textContent=''}function pickBin(x){if(x===sort[1]){sortFeedback.textContent='⭐ ¡Bien ordenado!';chime(true);setTimeout(newSort,650)}else{sortFeedback.textContent='Prueba otro lugar';chime(false)}}renderStory();newEmotion();newSort();show(location.hash.replace('#','')||'stories');window.addEventListener('hashchange',()=>show(location.hash.replace('#','')))</script></body></html>
