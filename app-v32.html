to;height:auto;object-fit:contain}.choices{width:100%;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.choice{border:4px solid #fff;border-radius:22px;background:#fff;color:#394363;padding:12px;font-weight:1000;box-shadow:0 5px #d1d8e9;min-height:72px}.choice img{width:100%;height:100px;object-fit:contain}.choice.big{font-size:38px}.feedback{min-height:32px;text-align:center;font-size:19px;font-weight:1000;color:#4f3bab}.story{background:#fff;border-radius:22px;padding:15px;text-align:center}.story .visual{font-size:88px}.story p{font-size:18px;line-height:1.35;font-weight:800}.canvas{width:100%;height:280px;border:5px solid #e0e6f1;background:#fff;border-radius:22px;touch-action:none}.palette{display:flex;justify-content:center;gap:8px;margin-bottom:10px}.sw{width:40px;height:40px;border:4px solid #fff;border-radius:50%;box-shadow:0 3px #bbb}.fx{position:fixed;inset:0;pointer-events:none;z-index:99}.star{position:absolute;bottom:18%;font-size:34px;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translateY(-220px) rotate(180deg) scale(.4);opacity:0}}@media(max-width:560px){.worlds{grid-template-columns:1fr}.tabs{grid-template-columns:1fr}.hero{padding:14px}.castCard img{max-height:130px}.guide{grid-template-columns:72px 1fr}.guide img{height:72px}.focus{min-height:320px}.choices{grid-template-columns:1fr 1fr}}@media(max-width:360px){.app{padding:8px}.world,.hero,.gameShell{border-width:5px}.castCard img{max-height:105px}.choice img{height:85px}.prompt{font-size:20px}}</style></head><body><div class="app"><section id="home" class="screen on"><header class="top"><div class="logo">Mundo <b>Mimo</b> ⭐</div><button id="voiceBtn" class="pill" onclick="toggleVoice()">🔊 VOZ</button></header><div class="hero"><h1>Juega.<br>Aprende.<br>Imagina.</h1><p>Una aventura sencilla y visual con Mimo, Lío y Pipa.</p><div class="cast"><div class="castCard"><img src="./assets/pipa-elephant.svg" alt="Pipa"></div><div class="castCard"><img src="./assets/mimo-bear.svg" alt="Mimo"></div><div class="castCard"><img src="./assets/lio-lion.svg" alt="Lío"></div></div><button class="cta" onclick="today()">▶ AVENTURA DE HOY</button></div><div class="sectionTitle">Elige un mundo</div><div class="worlds"><button class="world villa" onclick="openWorld('village')"><h3>🏠 Villa Mimo</h3><p>Cuentos, emociones y dibujo.</p><figure><img src="./assets/mimo-bear.svg" alt="Mimo"></figure></button><button class="world forest" onclick="openWorld('forest')"><h3>🌳 Bosque de Lío</h3><p>Animales, memoria y sonidos reales.</p><figure><img src="./assets/lio-lion.svg" alt="Lío"></figure></button><button class="world lagoon" onclick="openWorld('lagoon')"><h3>💦 Laguna de Pipa</h3><p>Números, colores y formas.</p><figure><img src="./assets/pipa-elephant.svg" alt="Pipa"></figure></button><button class="world mount" onclick="openWorld('mount')"><h3>⭐ Monte Aventura</h3><p>Letras, lógica y clasificación.</p><figure><img src="./assets/mimo-bear.svg" alt="Mimo"></figure></button></div><div class="trust"><b>👨‍👩‍👧 Pensada para familias</b><div class="trustRow"><span>✓ Sin anuncios</span><span>✓ Sin compras infantiles</span><span>✓ Sin cronómetros</span><span>✓ Pantallas limpias</span><span>✓ Refuerzo positivo</span></div></div></section><section id="play" class="screen"><div class="gameTop"><button class="back" onclick="goHome()">← INICIO</button><div class="logo">Mundo <b>Mimo</b></div></div><div class="gameShell"><div class="guide"><img id="guideImg" alt="Guía"><div><h2 id="worldTitle"></h2><p id="worldDesc"></p></div></div><div id="tabs" class="tabs"></div><div id="games"></div></div></section></div><div id="fx" class="fx"></div><script src="./assets/voice-bank-v32.js"></script><script>let voice=true,worldKey='forest';const worlds={forest:{title:'Bosque de Lío',desc:'Animales y sonidos reales.',hero:'./assets/lio-lion.svg',tabs:[['animals','Animales'],['pairs','Parejas'],['sounds','Sonidos']]},lagoon:{title:'Laguna de Pipa',desc:'Números, colores y formas.',hero:'./assets/pipa-elephant.svg',tabs:[['count','Contar'],['colors','Colores'],['shapes','Formas']]},village:{title:'Villa Mimo',desc:'Cuentos, emociones y dibujo.',hero:'./assets/mimo-bear.svg',tabs:[['story','Cuento'],['emotion','Emociones'],['draw','Dibujo']]},mount:{title:'Monte Aventura',desc:'Letras, lógica y clasificación.',hero:'./assets/mimo-bear.svg',tabs:[['letters','Letras'],['logic','Lógica'],['sort','Clasificar']]}};const animals=[['Perro','./assets/dog-mimo.svg','dog','perro'],['Gato','./assets/cat-mimo.svg','cat','gato'],['Vaca','./assets/cow-mimo.svg','cow','vaca'],['Rana','./assets/frog-mimo.svg','frog','rana']];function say(t,k){if(!voice)return;MimoVoice.sayLabel(t,k)}function toggleVoice(){voice=!voice;MimoVoice.setEnabled(voice);voiceBtn.textContent=voice?'🔊 VOZ':'🔇 VOZ'}function celebrate(t='¡Muy bien!'){MimoVoice.speak(t);for(let i=0;i<10;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','✨','👏','💛'][i%4];s.style.left=(10+Math.random()*80)+'%';fx.appendChild(s);setTimeout(()=>s.remove(),950)}}function today(){openWorld(['forest','lagoon','village','mount'][new Date().getDate()%4])}function openWorld(k){worldKey=k;home.classList.remove('on');play.classList.add('on');const w=worlds[k];guideImg.src=w.hero;worldTitle.textContent=w.title;worldDesc.textContent=w.desc;tabs.innerHTML=w.tabs.map((x,i)=>`<button class="tab ${i?'':'on'}" onclick="showGame('${x[0]}',this)">${x[1]}</button>`).join('');showGame(w.tabs[0][0],tabs.firstElementChild);MimoVoice.speak(w.title)}function goHome(){play.classList.remove('on');home.classList.add('on');MimoVoice.stop()}function showGame(id,btn){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));if(btn)btn.classList.add('on');render(id)}function render(id){if(id==='animals'){animalGame(0);return}if(id==='pairs'){pairGame();return}if(id==='sounds'){soundGame();return}if(id==='count'){countGame();return}if(id==='colors'){colorGame();return}if(id==='shapes'){shapeGame();return}if(id==='story'){storyGame();return}if(id==='emotion'){emotionGame();return}if(id==='draw'){drawGame();return}if(id==='letters'){letterGame();return}if(id==='logic'){logicGame();return}sortGame()}function animalGame(i){const a=animals[i];games.innerHTML=`<div class="game on"><div class="prompt">${a[0]}</div><div class="focus"><img src="${a[1]}" alt="${a[0]}"><div class="choices"><button class="choice" onclick="say('${a[0]}','${a[3]}')">🔊 ESCUCHAR NOMBRE</button><button class="choice" onclick="MimoVoice.clip('${a[2]}')">🎵 SONIDO REAL</button></div><div class="choices">${animals.map((x,j)=>`<button class="choice" onclick="animalGame(${j})">${x[0]}</button>`).join('')}</div></div></div>`;say(a[0],a[3])}let pairFirst=null,pairDone=[];function pairGame(){const deck=[0,1,2,0,1,2].sort(()=>Math.random()-.5);games.innerHTML=`<div class="game on"><div class="prompt">Encuentra las parejas</div><div class="choices">${deck.map((n,i)=>`<button id="pc${i}" class="choice" onclick="flipPair(${i},${n})"><img style="visibility:hidden" src="${animals[n][1]}"></button>`).join('')}</div><div id="fb" class="feedback"></div></div>`;MimoVoice.speak('Encuentra las parejas');pairFirst=null;pairDone=[]}function flipPair(i,n){if(pairDone.includes(i))return;const b=document.getElementById('pc'+i);b.querySelector('img').style.visibility='visible';if(!pairFirst){pairFirst=[i,n];return}if(pairFirst[0]===i)return;if(pairFirst[1]===n){pairDone.push(pairFirst[0],i);document.getElementById('fb').textContent='¡Pareja!';celebrate('¡Muy bien!');pairFirst=null}else{const old=pairFirst[0];pairFirst=null;setTimeout(()=>{document.getElementById('pc'+old).querySelector('img').style.visibility='hidden';b.querySelector('img').style.visibility='hidden'},650)}}function soundGame(){const n=Math.floor(Math.random()*4);games.innerHTML=`<div class="game on"><div class="prompt">¿Quién hace este sonido?</div><div class="focus"><button class="choice big" onclick="MimoVoice.clip('${animals[n][2]}')">▶ 🔊</button><div class="choices">${animals.map((a,i)=>`<button class="choice" onclick="${i===n?`celebrate('¡Eso es!');setTimeout(soundGame,700)`: `MimoVoice.speak('Prueba otra vez')`}"><img src="${a[1]}" alt="${a[0]}"><b>${a[0]}</b></button>`).join('')}</div><div class="feedback">Escucha y toca</div></div></div>`;MimoVoice.speak('¿Quién hace este sonido?');setTimeout(()=>MimoVoice.clip(animals[n][2]),400)}function countGame(){const n=1+Math.floor(Math.random()*5);games.innerHTML=`<div class="game on"><div class="prompt">¿Cuántos peces hay?</div><div class="focus"><div style="font-size:56px;text-align:center">${'🐟 '.repeat(n)}</div><div class="choices">${[1,2,3,4,5,6].slice(0,4).map(x=>`<button class="choice big" onclick="${x===n?`celebrate('¡Correcto!');setTimeout(countGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">${x}</button>`).join('')}</div></div></div>`;MimoVoice.speak('¿Cuántos peces hay?')}function colorGame(){const data=[['Rojo','#ff5c68'],['Azul','#4ba9ff'],['Amarillo','#ffd94d'],['Verde','#58cf73']];const n=Math.floor(Math.random()*data.length),target=data[n];games.innerHTML=`<div class="game on"><div class="prompt">Toca ${target[0]}</div><div class="focus"><div class="choices">${data.map((x,i)=>`<button class="choice" style="background:${x[1]};min-height:110px" onclick="${i===n?`celebrate('¡Muy bien!');setTimeout(colorGame,700)`: `MimoVoice.speak('Prueba otra vez')`}"></button>`).join('')}</div></div></div>`;MimoVoice.speak('Toca '+target[0])}function shapeGame(){const d=[['Círculo','●'],['Cuadrado','■'],['Triángulo','▲'],['Estrella','★']],n=Math.floor(Math.random()*4);games.innerHTML=`<div class="game on"><div class="prompt">Toca ${d[n][0]}</div><div class="focus"><div class="choices">${d.map((x,i)=>`<button class="choice big" onclick="${i===n?`celebrate('¡Genial!');setTimeout(shapeGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">${x[1]}</button>`).join('')}</div></div></div>`;MimoVoice.speak('Toca '+d[n][0])}function storyGame(){games.innerHTML=`<div class="game on"><div class="prompt">Un cuento con Mimo</div><div class="story"><div class="visual">🌈🐻🌳</div><p>Mimo encontró un arcoíris en el bosque. Miró sus colores y sonrió.</p><button class="choice" onclick="MimoVoice.speak('Mimo encontró un arcoíris en el bosque. Miró sus colores y sonrió.')">🔊 ESCUCHAR CUENTO</button></div></div>`;MimoVoice.speak('Un cuento con Mimo')}function emotionGame(){const d=[['Feliz','😊'],['Triste','😢'],['Sorprendido','😮'],['Enfadado','😠']],n=Math.floor(Math.random()*4);games.innerHTML=`<div class="game on"><div class="prompt">¿Quién está ${d[n][0].toLowerCase()}?</div><div class="focus"><div class="choices">${d.map((x,i)=>`<button class="choice big" onclick="${i===n?`celebrate('¡Muy bien!');setTimeout(emotionGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">${x[1]}</button>`).join('')}</div></div></div>`;MimoVoice.speak('¿Quién está '+d[n][0]+'?')}function drawGame(){games.innerHTML=`<div class="game on"><div class="prompt">Dibuja libremente</div><div class="palette"><button class="sw" style="background:#ef4d64" onclick="ink='#ef4d64'"></button><button class="sw" style="background:#4b8dff" onclick="ink='#4b8dff'"></button><button class="sw" style="background:#4bc56b" onclick="ink='#4bc56b'"></button><button class="sw" style="background:#212a45" onclick="ink='#212a45'"></button></div><canvas id="cv" class="canvas"></canvas></div>`;MimoVoice.speak('Dibuja libremente');setTimeout(initCanvas,20)}let ink='#ef4d64';function initCanvas(){const c=document.getElementById('cv'),x=c.getContext('2d');const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);x.lineWidth=6;x.lineCap='round';let on=false;const p=e=>{const q=e.touches?e.touches[0]:e,rr=c.getBoundingClientRect();return[q.clientX-rr.left,q.clientY-rr.top]};c.onpointerdown=e=>{on=true;const a=p(e);x.beginPath();x.moveTo(...a)};c.onpointermove=e=>{if(!on)return;const a=p(e);x.strokeStyle=ink;x.lineTo(...a);x.stroke()};c.onpointerup=()=>on=false;c.onpointerleave=()=>on=false}function letterGame(){const d=['A','M','S','P'],n=Math.floor(Math.random()*4);games.innerHTML=`<div class="game on"><div class="prompt">Toca la letra ${d[n]}</div><div class="focus"><div class="choices">${d.map((x,i)=>`<button class="choice big" onclick="${i===n?`celebrate('¡Muy bien!');setTimeout(letterGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">${x}</button>`).join('')}</div></div></div>`;MimoVoice.speak('Toca la letra '+d[n])}function logicGame(){games.innerHTML=`<div class="game on"><div class="prompt">¿Qué viene después?</div><div class="focus"><div style="font-size:54px">🟡 🩷 🟡 ?</div><div class="choices"><button class="choice big" onclick="celebrate('¡Correcto!');setTimeout(logicGame,700)">🩷</button><button class="choice big" onclick="MimoVoice.speak('Prueba otra vez')">🔵</button></div></div></div>`;MimoVoice.speak('¿Qué viene después?')}function sortGame(){const good=Math.random()>.5;games.innerHTML=`<div class="game on"><div class="prompt">¿Es un animal?</div><div class="focus"><div style="font-size:95px">${good?'🐶':'🚗'}</div><div class="choices"><button class="choice" onclick="${good?`celebrate('¡Sí!');setTimeout(sortGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">SÍ</button><button class="choice" onclick="${!good?`celebrate('¡Muy bien!');setTimeout(sortGame,700)`: `MimoVoice.speak('Prueba otra vez')`}">NO</button></div></div></div>`;MimoVoice.speak('¿Es un animal?')}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
