<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7057e8">
<title>Mundo Mimo 2 · Laboratorio jugable</title>
<style>
:root{font-family:ui-rounded,system-ui,-apple-system,sans-serif;color:#202035;background:#f6f3ff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{max-width:900px;margin:auto;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;gap:12px;margin-bottom:16px}.brand{width:54px;height:54px;border-radius:18px;background:#7057e8;color:#fff;display:grid;place-items:center;font-size:28px;font-weight:900}h1{font-size:clamp(24px,5vw,38px);margin:0}p{line-height:1.45}.agebar,.gamegrid,.choices,.pads{display:flex;flex-wrap:wrap;gap:10px}.agebar button,.gameCard,.action,.choice,.pad{min-height:54px;border:0;border-radius:18px;padding:12px 16px;font:inherit;font-weight:800;background:#fff;box-shadow:0 5px 18px #3f2d8a18}.agebar button[aria-pressed="true"]{background:#7057e8;color:white}.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-top:14px}.gameCard{text-align:left;min-height:110px}.gameCard small{display:block;margin-top:6px;font-weight:600;opacity:.68}.stage{background:#fff;border-radius:28px;padding:18px;min-height:350px;box-shadow:0 8px 28px #402f8d1c;margin-top:18px}.stageHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.stage h2{margin:0}.play{min-height:230px;display:grid;place-items:center;padding:16px}.bigTarget{width:min(220px,65vw);aspect-ratio:1;border:0;border-radius:50%;font-size:72px;background:#ffdf6e;box-shadow:inset 0 -10px 0 #eebf35;touch-action:manipulation}.dropzone{width:min(250px,70vw);height:150px;border:5px dashed #7057e8;border-radius:32px;display:grid;place-items:center;font-size:44px}.draggable{font-size:64px;touch-action:none;cursor:grab}.memoryGrid{display:grid;grid-template-columns:repeat(3,minmax(70px,110px));gap:12px}.memoryGrid button{aspect-ratio:1;border:0;border-radius:20px;font-size:34px;background:#e9e3ff}.scene{position:relative;width:min(560px,90vw);height:250px;border-radius:26px;background:linear-gradient(#bee7ff 0 55%,#bde08d 55%);overflow:hidden}.hiddenObj{position:absolute;border:0;background:transparent;font-size:40px;padding:12px}.pads{justify-content:center}.pad{width:90px;height:90px;font-size:34px}.pad.flash{outline:7px solid #ffca43;transform:scale(1.05)}.blocks{display:flex;align-items:flex-end;justify-content:center;gap:8px;min-height:170px}.block{border:0;border-radius:12px;background:#ff8cad;min-width:56px}.feedback{min-height:34px;font-size:18px;font-weight:800;text-align:center}.progress{height:10px;background:#eee9ff;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#7057e8;width:0}.visuallyHidden{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(1px,1px,1px,1px)!important}@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}@media(max-width:420px){.shell{padding-left:10px;padding-right:10px}.stage{padding:13px}.gamegrid{grid-template-columns:1fr 1fr}.gameCard{padding:10px;min-height:100px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand">M</div><div><h1>Mundo Mimo 2</h1><p style="margin:2px 0 0">Nuevo núcleo jugable · contenido por desarrollo</p></div></header>
<section aria-labelledby="ageTitle"><h2 id="ageTitle">Edad</h2><div id="ageBar" class="agebar"></div></section>
<section aria-labelledby="gamesTitle"><h2 id="gamesTitle">Juegos disponibles ahora</h2><div id="gameGrid" class="gamegrid"></div></section>
<section id="stage" class="stage" hidden aria-live="polite">
<div class="stageHead"><button id="closeGame" class="action" type="button">← Juegos</button><div><small id="gameMeta"></small><h2 id="gameTitle"></h2></div></div>
<div class="progress"><i id="progressBar"></i></div>
<div id="play" class="play"></div><div id="feedback" class="feedback"></div>
</section>
</div>
<script src="./core/platform-v200.js"></script>
<script src="./catalog/seed-games-v200.js"></script>
<script src="./runtime-v200.js"></script>
<script src="./runtime-v210-extension.js"></script>
<script src="./runtime-v220-extension.js"></script>
<script src="./runtime-v230-extension.js"></script>
</body></html>
